<title>CrowRules Entertainment | The Future Is Beginning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Orbitron:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--cyan:#55ecff;--purple:#9864ff;--pink:#ff4fd8;--white:#f7f8ff}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#02030a;color:var(--white);font-family:Montserrat,Arial,sans-serif}body{overflow:hidden}.intro{position:relative;isolation:isolate;display:grid;place-items:center;min-height:100svh;overflow:hidden;background:radial-gradient(ellipse at 50% 55%,#10152c 0%,#050711 42%,#02030a 75%)}.space,.space:before,.space:after{position:absolute;inset:-20%;pointer-events:none}.space{z-index:-4;background-image:radial-gradient(1px 1px at 15% 25%,#fff 98%,transparent),radial-gradient(2px 2px at 78% 18%,#fff 98%,transparent),radial-gradient(1px 1px at 63% 72%,#fff 98%,transparent),radial-gradient(1px 1px at 32% 82%,#fff 98%,transparent),radial-gradient(1px 1px at 91% 61%,#fff 98%,transparent),radial-gradient(2px 2px at 43% 38%,#fff 98%,transparent);background-size:430px 330px;opacity:.6;animation:starDrift 28s linear infinite}.space:before{content:"";background:radial-gradient(ellipse at 25% 65%,rgba(88,55,190,.3),transparent 35%),radial-gradient(ellipse at 76% 38%,rgba(0,203,255,.23),transparent 32%),radial-gradient(ellipse at 50% 50%,rgba(255,60,202,.08),transparent 44%);filter:blur(22px);animation:nebula 9s ease-in-out infinite alternate}.space:after{content:"";background:repeating-linear-gradient(115deg,transparent 0 8%,rgba(95,220,255,.025) 8.1%,transparent 8.3% 16%);transform:perspective(450px) rotateX(62deg) scale(1.8) translateY(20%);transform-origin:center bottom;mask-image:linear-gradient(transparent 15%,#000 80%);animation:gridMove 7s linear infinite}.vignette{position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse,transparent 25%,rgba(0,0,0,.4) 75%,#000 120%)}.scanlines{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.14;background:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(255,255,255,.1) 4px,transparent 5px)}.beam{position:absolute;top:-30%;left:50%;height:160%;width:min(30vw,340px);transform:translateX(-50%) rotate(22deg);background:linear-gradient(90deg,transparent,rgba(74,227,255,.045),rgba(163,92,255,.11),rgba(74,227,255,.045),transparent);filter:blur(14px);animation:beamSweep 7s ease-in-out infinite alternate}.portal{position:absolute;width:min(72vw,660px);aspect-ratio:1;border-radius:50%;border:1px solid rgba(84,232,255,.18);box-shadow:0 0 45px rgba(40,203,255,.08),inset 0 0 65px rgba(134,83,255,.09);transform:rotateX(68deg) rotateZ(-18deg);animation:portalPulse 5s ease-in-out infinite}.portal:before,.portal:after{content:"";position:absolute;inset:9%;border:1px solid rgba(161,102,255,.32);border-radius:50%;box-shadow:0 0 24px rgba(155,92,255,.1)}.portal:after{inset:20%;border-color:rgba(77,234,255,.28)}.core{position:absolute;width:min(28vw,220px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(81,231,255,.5) 5%,rgba(105,72,255,.17) 28%,transparent 70%);filter:blur(2px);animation:corePulse 3.5s ease-in-out infinite}.content{width:min(980px,90vw);position:relative;z-index:2;text-align:center;padding:30px 0 70px;animation:contentReveal 1.8s cubic-bezier(.16,1,.3,1) both}.eyebrow{font:700 10px Orbitron,sans-serif;letter-spacing:.45em;color:var(--cyan);text-transform:uppercase;opacity:0;animation:rise .9s 1s ease forwards}.logo{font:900 clamp(3rem,11vw,8.5rem)/.9 Orbitron,sans-serif;letter-spacing:-.075em;margin:27px 0 24px;text-shadow:0 0 35px rgba(85,236,255,.18);opacity:0;animation:logoReveal 1.6s 1.25s cubic-bezier(.16,1,.3,1) forwards}.logo b{font-weight:900;background:linear-gradient(100deg,#fff 0%,var(--cyan) 28%,var(--purple) 66%,var(--pink) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}.headline{font:800 clamp(1.3rem,4vw,2.6rem)/1.2 Montserrat,sans-serif;letter-spacing:.12em;text-transform:uppercase;margin:0 auto 20px;opacity:0;animation:rise 1s 2s ease forwards}.headline span{display:block;color:var(--cyan);text-shadow:0 0 24px rgba(85,236,255,.32)}.tagline{font:700 clamp(10px,1.5vw,13px) Orbitron,sans-serif;letter-spacing:.3em;color:#c8cce0;opacity:0;animation:rise 1s 2.5s ease forwards}.rule{height:1px;width:min(360px,55vw);margin:32px auto 0;background:linear-gradient(90deg,transparent,var(--cyan),var(--purple),transparent);transform:scaleX(0);animation:lineReveal 1.2s 2.7s ease forwards}.enter{position:absolute;z-index:5;bottom:clamp(24px,6vh,55px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;white-space:nowrap;border:1px solid rgba(85,236,255,.48);border-radius:999px;padding:14px 21px;background:rgba(5,9,20,.78);color:#f7fbff;text-decoration:none;font:700 10px Montserrat,sans-serif;letter-spacing:.2em;backdrop-filter:blur(12px);transition:background .25s,border-color .25s,box-shadow .25s}.enter:hover,.enter:focus-visible{background:rgba(85,236,255,.13);border-color:var(--cyan);box-shadow:0 0 28px rgba(85,236,255,.18);outline:none}.arrow{color:var(--cyan);font-size:16px}.loading{position:absolute;bottom:0;left:0;width:100%;height:2px;background:rgba(255,255,255,.08);z-index:6}.loading span{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink));box-shadow:0 0 15px var(--cyan);animation:load 8s linear forwards}.intro.leaving .content{animation:exit .75s ease forwards}.intro.leaving .portal{animation:portalExit .75s ease forwards}.intro.leaving .beam{opacity:0;transition:opacity .5s}.intro.leaving .loading span{width:100%}@keyframes starDrift{to{transform:translate3d(3%,2%,0)}}@keyframes nebula{to{transform:scale(1.14) rotate(8deg);opacity:.75}}@keyframes gridMove{to{background-position:0 140px}}@keyframes beamSweep{from{transform:translateX(-100%) rotate(22deg);opacity:.25}to{transform:translateX(100%) rotate(22deg);opacity:.9}}@keyframes portalPulse{50%{transform:rotateX(68deg) rotateZ(-8deg) scale(1.06);opacity:.65}}@keyframes corePulse{50%{transform:scale(1.25);opacity:.65}}@keyframes contentReveal{from{opacity:0;filter:blur(12px);transform:scale(1.06)}to{opacity:1;filter:blur(0);transform:scale(1)}}@keyframes logoReveal{0%{opacity:0;transform:scale(.7);filter:blur(20px);letter-spacing:.12em}70%{opacity:1;filter:blur(0)}100%{opacity:1;transform:scale(1);letter-spacing:-.075em}}@keyframes rise{from{opacity:0;transform:translateY(18px);filter:blur(5px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}@keyframes lineReveal{to{transform:scaleX(1)}}@keyframes load{to{width:100%}}@keyframes exit{to{opacity:0;transform:scale(1.08);filter:blur(12px)}}@keyframes portalExit{to{transform:rotateX(68deg) rotateZ(0deg) scale(1.5);opacity:0}}@media(max-width:600px){.portal{width:115vw}.logo{letter-spacing:-.08em}.headline{letter-spacing:.07em}.tagline{letter-spacing:.18em}.enter{bottom:28px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}.loading span{animation:none;width:100%}}
</style>
<script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-notifications.js?v=3" defer></script>
<script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-sitewide.js?v=5" defer></script></head>
<body>
<main class="intro" id="intro" aria-label="CrowRules Entertainment cinematic introduction">
<div class="space" aria-hidden="true"></div><div class="beam" aria-hidden="true"></div><div class="portal" aria-hidden="true"></div><div class="core" aria-hidden="true"></div><div class="vignette" aria-hidden="true"></div><div class="scanlines" aria-hidden="true"></div>
<section class="content">
<div class="eyebrow">A NEW ERA OF ENTERTAINMENT</div>
<h1 class="logo">CROW<b>RULES</b></h1>
<h2 class="headline">THE FUTURE <span>IS BEGINNING.</span></h2>
<div class="tagline">ONE COMPANY. ONE UNIVERSE.</div>
<div class="rule"></div>
</section>
<a class="enter" id="enter" href="home.html"><span>ENTER CROWRULES ENTERTAINMENT</span><span class="arrow" aria-hidden="true">↗</span></a>
<div class="loading" aria-hidden="true"><span></span></div>
</main>
<script>
(function(){
  const intro=document.getElementById("intro");
  const enter=document.getElementById("enter");
  let leaving=false;
  function goHome(){
    if(leaving)return;
    leaving=true;
    intro.classList.add("leaving");
    enter.setAttribute("aria-disabled","true");
    window.setTimeout(function(){window.location.href="home.html";},650);
  }
  enter.addEventListener("click",function(event){event.preventDefault();goHome();});
  const reduced=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  window.setTimeout(goHome,reduced?1200:8000);
})();
</script>
</body>
</html>
