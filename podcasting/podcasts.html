<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07080d">
<title>CrowRules Podcasting — Podcasts</title>
<meta name="description" content="Discover podcasts across the CrowRules Podcasting universe.">
<style>
:root{--bg:#07080d;--panel:#0e1019;--panel2:#121522;--line:#292440;--text:#f7f4ff;--muted:#aaa5ba;--cyan:#58e6ff;--purple:#9b72ff;--good:#6df0b0;--bad:#ff7696}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 50% -10%,#21183d 0,#0a0b12 38%,var(--bg) 72%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-top:72px}.shell{width:min(1500px,calc(100% - 32px));margin:auto}.hero{padding:52px 0 28px;display:grid;grid-template-columns:1.25fr .75fr;gap:28px;align-items:end}.eyebrow{color:var(--cyan);font-size:11px;font-weight:900;letter-spacing:.2em;text-transform:uppercase}.hero h1{font-size:clamp(38px,6vw,76px);line-height:.95;margin:12px 0 15px;letter-spacing:-.045em}.hero p{max-width:720px;color:var(--muted);font-size:16px;line-height:1.7;margin:0}.hero-card{border:1px solid var(--line);background:linear-gradient(145deg,#151326,#0b0d15);border-radius:22px;padding:22px;box-shadow:0 25px 80px #0008}.hero-card strong{display:block;font-size:30px}.hero-card span{display:block;color:var(--muted);font-size:12px;margin-top:5px}.toolbar{display:grid;grid-template-columns:minmax(220px,1fr) 170px 170px auto;gap:10px;padding:16px;border:1px solid var(--line);background:#0c0e16e8;border-radius:18px;position:sticky;top:72px;z-index:20;backdrop-filter:blur(14px)}input,select,button{font:inherit}input,select{width:100%;background:#080a11;color:var(--text);border:1px solid #302b45;border-radius:11px;padding:12px 13px;outline:none}input:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #58e6ff12}.btn{border:1px solid #3a3155;background:#161326;color:#fff;border-radius:11px;padding:11px 15px;font-weight:900;cursor:pointer}.btn:hover{border-color:var(--cyan);transform:translateY(-1px)}.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}.status{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0;color:var(--muted);font-size:12px}.status strong{color:var(--text)}.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 10px var(--good);margin-right:7px}.status-dot.bad{background:var(--bad);box-shadow:0 0 10px var(--bad)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;padding-bottom:50px}.card{position:relative;overflow:hidden;border:1px solid var(--line);background:linear-gradient(145deg,#111421,#0b0d15);border-radius:19px;min-width:0;transition:.2s}.card:hover{transform:translateY(-3px);border-color:#58e6ff55;box-shadow:0 22px 60px #0009}.art{aspect-ratio:1.35;background:radial-gradient(circle at 30% 20%,#33245c,#10121c 65%);display:grid;place-items:center;overflow:hidden}.art img{width:100%;height:100%;object-fit:cover}.art-fallback{font-size:38px;font-weight:950;color:#58e6ff;text-shadow:0 0 30px #58e6ff55}.body{padding:16px}.badge{display:inline-flex;border:1px solid #3a3155;border-radius:999px;padding:4px 8px;color:var(--cyan);font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;margin-bottom:9px}.card h2{font-size:19px;line-height:1.2;margin:0 0 7px}.creator{color:var(--muted);font-size:12px}.description{color:#c2bdcf;font-size:12px;line-height:1.55;margin:11px 0 14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.meta{display:flex;gap:12px;color:var(--muted);font-size:10px;border-top:1px solid #ffffff0c;padding-top:12px}.card-link{position:absolute;inset:0;z-index:1}.body>*:not(.card-link),.art>*{position:relative;z-index:2}.empty,.error,.loading{grid-column:1/-1;border:1px dashed #39324e;border-radius:18px;padding:48px 20px;text-align:center;color:var(--muted);background:#0b0d15}.error{color:#ffb0c2;border-color:#5a2940}.error button{margin-top:15px}.skeleton{height:360px;border-radius:19px;background:linear-gradient(90deg,#0e1018,#181827,#0e1018);background-size:200% 100%;animation:shimmer 1.3s infinite}@keyframes shimmer{to{background-position:-200% 0}}@media(max-width:1050px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.toolbar{grid-template-columns:1fr 1fr 1fr auto}}@media(max-width:760px){body{padding-top:116px}.shell{width:min(100% - 20px,1500px)}.hero{padding-top:32px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar{top:116px;grid-template-columns:1fr 1fr;position:sticky}.toolbar .search{grid-column:1/-1}}@media(max-width:520px){.grid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr 1fr}.toolbar button{grid-column:1/-1}.hero h1{font-size:48px}.status{align-items:flex-start;flex-direction:column}}
</style>
<script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-sitewide.js?v=5" defer></script>
<script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-notifications.js?v=3" defer></script>
</head>
<body>
<main class="shell">
<section class="hero" aria-labelledby="page-title">
<div><div class="eyebrow">CrowRules Podcasting</div><h1 id="page-title">Podcasts</h1><p>Discover shows, creators, stories and conversations across the CrowRules Podcasting universe.</p></div>
<div class="hero-card"><strong id="count">—</strong><span>podcasts in the directory</span></div>
</section>
<section class="toolbar" aria-label="Podcast directory controls">
<input class="search" id="search" type="search" placeholder="Search podcasts, creators, categories…" autocomplete="off">
<select id="category" aria-label="Category"><option value="">All categories</option></select>
<select id="sort" aria-label="Sort"><option value="newest">Newest</option><option value="title">Title A–Z</option><option value="popular">Popular</option></select>
<button class="btn" id="refresh" type="button">Refresh</button>
</section>
<div class="status"><span><i class="status-dot" id="statusDot"></i><span id="statusText">Connecting to Podcasting…</span></span><strong id="resultCount">—</strong></div>
<section class="grid" id="grid" aria-live="polite"></section>
</main>
<script>
(() => {
  'use strict';
  const grid=document.getElementById('grid'), search=document.getElementById('search'), category=document.getElementById('category'), sort=document.getElementById('sort'), refresh=document.getElementById('refresh');
  const count=document.getElementById('count'), resultCount=document.getElementById('resultCount'), statusText=document.getElementById('statusText'), statusDot=document.getElementById('statusDot');
  let rows=[];
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const value=(r,...keys)=>{for(const k of keys){if(r?.[k]!==undefined&&r?.[k]!==null&&String(r[k]).trim()!=='')return r[k]}return ''};
  function setStatus(text,bad=false){statusText.textContent=text;statusDot.classList.toggle('bad',bad)}
  function loading(){grid.innerHTML='<div class="skeleton"></div>'.repeat(8);resultCount.textContent='Loading…'}
  function fallbackLetter(name){return esc((String(name||'P').trim()[0]||'P').toUpperCase())}
  function normalize(r){
    const title=value(r,'title','name','podcast_name')||'Untitled Podcast';
    const creator=value(r,'creator_name','host_name','author_name','creator','author')||'CrowRules Creator';
    const id=value(r,'id','uuid','podcast_id','slug')||'';
    const slug=value(r,'slug')||id;
    return {raw:r,id,slug,title,creator,description:value(r,'description','summary','about'),category:value(r,'category','genre','type')||'Podcast',art:value(r,'artwork_url','cover_url','image_url','thumbnail_url','artwork','cover_art'),created:value(r,'created_at','published_at','release_date'),followers:Number(value(r,'followers_count','subscriber_count','subscribers','followers')||0),episodes:Number(value(r,'episode_count','episodes_count','episodes')||0),status:value(r,'status')||''};
  }
  function render(){
    const q=search.value.trim().toLowerCase(),cat=category.value;
    let list=rows.filter(r=>{const text=[r.title,r.creator,r.description,r.category].join(' ').toLowerCase();return (!q||text.includes(q))&&(!cat||r.category===cat)});
    if(sort.value==='title')list.sort((a,b)=>a.title.localeCompare(b.title));
    else if(sort.value==='popular')list.sort((a,b)=>b.followers-a.followers||b.episodes-a.episodes);
    else list.sort((a,b)=>new Date(b.created||0)-new Date(a.created||0));
    resultCount.textContent=`${list.length} result${list.length===1?'':'s'}`;
    if(!list.length){grid.innerHTML='<div class="empty"><strong>No podcasts found.</strong><br>Try another search or clear the filters.</div>';return}
    grid.innerHTML=list.map(r=>{
      const href=r.id||r.slug?`podcast.html?id=${encodeURIComponent(r.id||r.slug)}`:'podcast.html';
      const art=r.art?`<img src="${esc(r.art)}" alt="${esc(r.title)} artwork" loading="lazy" onerror="this.remove();this.parentElement.insertAdjacentHTML('beforeend','<div class=\'art-fallback\'>${fallbackLetter(r.title)}</div>')">`:`<div class="art-fallback">${fallbackLetter(r.title)}</div>`;
      return `<article class="card"><a class="card-link" href="${href}" aria-label="Open ${esc(r.title)}"></a><div class="art">${art}</div><div class="body"><span class="badge">${esc(r.category)}</span><h2>${esc(r.title)}</h2><div class="creator">${esc(r.creator)}</div><p class="description">${esc(r.description||'Explore this podcast on CrowRules Podcasting.')}</p><div class="meta"><span>${r.episodes||0} episode${r.episodes===1?'':'s'}</span><span>${r.followers||0} follower${r.followers===1?'':'s'}</span></div></div></article>`;
    }).join('');
  }
  function fillCategories(){
    const cats=[...new Set(rows.map(r=>r.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
    category.innerHTML='<option value="">All categories</option>'+cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
  }
  async function load(){
    loading();refresh.disabled=true;setStatus('Connecting to Podcasting…');
    try{
      const wait=async()=>{
        for(let i=0;i<80;i++){if(window.CrowRulesAuth?.client)return window.CrowRulesAuth.client;await new Promise(r=>setTimeout(r,100))}
        throw new Error('CrowRules client unavailable');
      };
      const db=await wait();
      const result=await db.from('podcasts').select('*');
      if(result.error)throw result.error;
      rows=(result.data||[]).map(normalize);
      count.textContent=rows.length.toLocaleString();fillCategories();render();setStatus('Podcast directory connected');
    }catch(err){
      console.error('[podcasts.html]',err);rows=[];count.textContent='—';resultCount.textContent='Unavailable';grid.innerHTML='<div class="error"><strong>Podcast directory could not load.</strong><br>'+esc(err?.message||'Connection error')+'<br><button class="btn" id="retry" type="button">Try Again</button></div>';setStatus('Connection issue',true);document.getElementById('retry')?.addEventListener('click',load);
    }finally{refresh.disabled=false}
  }
  search.addEventListener('input',render);category.addEventListener('change',render);sort.addEventListener('change',render);refresh.addEventListener('click',load);window.addEventListener('crowrules-auth',()=>{if(!rows.length)load()},{once:true});load();
})();
</script>
</body>
</html>
