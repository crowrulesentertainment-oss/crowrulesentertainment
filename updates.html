<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#05070b"
  >

  <meta
    name="description"
    content="CrowRules Updates — Development activity, launches, production milestones and company updates."
  >

  <title>CrowRules Updates</title>

  <link rel="stylesheet" href="styles.css">

  <!-- Supabase JS v2 -->
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    defer
  ></script>

  <script src="app.js" defer></script>

  <style>
    /* =========================================================
       CROWRULES UPDATES
       Supabase-connected page enhancements
    ========================================================= */

    .updates-status {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 22px 0 30px;
      padding: 10px 14px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.025);
      border-radius: 999px;
      width: fit-content;
      font-size: .78rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: rgba(255,255,255,.65);
    }

    .updates-status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #777;
      box-shadow: 0 0 0 4px rgba(255,255,255,.04);
    }

    .updates-status.live .dot {
      background: #57e389;
      box-shadow:
        0 0 0 4px rgba(87,227,137,.08),
        0 0 14px rgba(87,227,137,.55);
    }

    .updates-status.error .dot {
      background: #ff6464;
      box-shadow: 0 0 0 4px rgba(255,100,100,.08);
    }

    .updates-status.loading .dot {
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%,100% {
        opacity: .35;
        transform: scale(.85);
      }

      50% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .updates-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    .updates-count {
      color: rgba(255,255,255,.48);
      font-size: .82rem;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .updates-refresh {
      appearance: none;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      color: #fff;
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
      font: inherit;
      font-size: .78rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      transition:
        background .2s ease,
        border-color .2s ease,
        transform .2s ease;
    }

    .updates-refresh:hover {
      background: rgba(255,255,255,.08);
      border-color: rgba(255,255,255,.22);
      transform: translateY(-1px);
    }

    .updates-refresh:disabled {
      opacity: .5;
      cursor: wait;
    }

    .update-card {
      position: relative;
      overflow: hidden;
    }

    .update-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      background: rgba(255,255,255,.16);
      transition: background .2s ease;
    }

    .update-card:hover::before {
      background: currentColor;
    }

    .update-card.priority-high::before {
      background: #ffb84d;
    }

    .update-card.priority-critical::before {
      background: #ff5f5f;
    }

    .update-card .update-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .update-type {
      font-size: .68rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(255,255,255,.48);
    }

    .update-priority {
      font-size: .65rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 5px 8px;
      border-radius: 5px;
      border: 1px solid rgba(255,255,255,.09);
      background: rgba(255,255,255,.025);
      color: rgba(255,255,255,.55);
    }

    .priority-high .update-priority {
      color: #ffca72;
      border-color: rgba(255,202,114,.18);
      background: rgba(255,202,114,.05);
    }

    .priority-critical .update-priority {
      color: #ff7474;
      border-color: rgba(255,116,116,.18);
      background: rgba(255,116,116,.05);
    }

    .update-card h2 {
      margin-bottom: 10px;
    }

    .update-description {
      color: rgba(255,255,255,.66);
      line-height: 1.7;
    }

    .update-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 22px;
      padding-top: 15px;
      border-top: 1px solid rgba(255,255,255,.06);
    }

    .update-context {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .update-tag {
      padding: 5px 8px;
      border-radius: 5px;
      background: rgba(255,255,255,.035);
      border: 1px solid rgba(255,255,255,.06);
      color: rgba(255,255,255,.48);
      font-size: .67rem;
      letter-spacing: .04em;
    }

    .update-date {
      color: rgba(255,255,255,.38);
      font-size: .7rem;
      white-space: nowrap;
    }

    .update-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 15px;
      color: inherit;
      text-decoration: none;
      font-size: .76rem;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .update-link:hover {
      text-decoration: underline;
    }

    .updates-empty,
    .updates-error {
      grid-column: 1 / -1;
      text-align: center;
      padding: 55px 25px;
    }

    .updates-empty h2,
    .updates-error h2 {
      margin-bottom: 8px;
    }

    .updates-empty p,
    .updates-error p {
      color: rgba(255,255,255,.48);
    }

    .updates-loading {
      grid-column: 1 / -1;
      display: grid;
      gap: 14px;
    }

    .skeleton {
      min-height: 220px;
      border-radius: 14px;
      background:
        linear-gradient(
          90deg,
          rgba(255,255,255,.025),
          rgba(255,255,255,.07),
          rgba(255,255,255,.025)
        );
      background-size: 300% 100%;
      animation: skeleton 1.4s infinite;
    }

    @keyframes skeleton {
      0% {
        background-position: 100% 0;
      }

      100% {
        background-position: -100% 0;
      }
    }

    @media (max-width: 700px) {
      .updates-toolbar {
        align-items: flex-start;
      }

      .update-footer {
        align-items: flex-start;
        flex-direction: column;
      }

      .update-date {
        white-space: normal;
      }
    }
  </style>
</head>

<body>

<script>
  /*
   * Keep the site's existing shared navigation.
   * app.js provides nav().
   */
  document.write(
    typeof nav === "function"
      ? nav("updates")
      : ""
  );
</script>

<main class="wrap page">

  <div class="eyebrow">
    05 / COMPANY FEED
  </div>

  <section class="hero">

    <h1>
      WHAT'S <span>MOVING.</span>
    </h1>

    <p class="lead">
      Development activity, launches, production milestones
      and company updates.
    </p>

    <div
      id="connectionStatus"
      class="updates-status loading"
      aria-live="polite"
    >
      <span class="dot"></span>
      <span id="connectionText">
        Connecting to CrowRules
      </span>
    </div>

  </section>

  <div class="updates-toolbar">

    <div
      id="updatesCount"
      class="updates-count"
    >
      Loading updates…
    </div>

    <button
      id="refreshButton"
      class="updates-refresh"
      type="button"
    >
      Refresh
    </button>

  </div>

  <section
    id="grid"
    class="grid g3"
    aria-live="polite"
    aria-busy="true"
  >

    <div class="updates-loading">

      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>

    </div>

  </section>

</main>

<script>
/* ============================================================
   CROWRULES ENTERTAINMENT
   UPDATES — SUPABASE CONNECTION
   ============================================================ */

(function () {

  "use strict";

  /*
   * Supabase project configuration.
   *
   * This is a publishable browser key.
   * NEVER place a service_role/secret key here.
   */
  const SUPABASE_URL =
    "https://zauxdqyssratvzmomozf.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_-Z6wecSOxwOk6IBut2zLnw_8DfRxnE9";

  const TABLE =
    "cr_updates";

  let supabaseClient = null;
  let realtimeChannel = null;
  let currentRows = [];

  const grid =
    document.getElementById("grid");

  const connectionStatus =
    document.getElementById("connectionStatus");

  const connectionText =
    document.getElementById("connectionText");

  const updatesCount =
    document.getElementById("updatesCount");

  const refreshButton =
    document.getElementById("refreshButton");


  /* ==========================================================
     HELPERS
  ========================================================== */

  function esc(value) {

    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function formatDate(value) {

    if (!value) {
      return "Date unavailable";
    }

    const date =
      new Date(value);

    if (Number.isNaN(date.getTime())) {
      return "Date unavailable";
    }

    return new Intl.DateTimeFormat(
      "en-US",
      {
        month: "short",
        day: "numeric",
        year: "numeric"
      }
    ).format(date);
  }


  function formatDateTime(value) {

    if (!value) {
      return "";
    }

    const date =
      new Date(value);

    if (Number.isNaN(date.getTime())) {
      return "";
    }

    return new Intl.DateTimeFormat(
      "en-US",
      {
        month: "short",
        day: "numeric",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit"
      }
    ).format(date);
  }


  function priorityClass(priority) {

    const value =
      String(priority || "normal")
        .toLowerCase()
        .trim();

    if (
      value === "critical" ||
      value === "urgent"
    ) {
      return "priority-critical";
    }

    if (
      value === "high"
    ) {
      return "priority-high";
    }

    return "";
  }


  function setConnectionState(
    state,
    text
  ) {

    connectionStatus.className =
      "updates-status " + state;

    connectionText.textContent =
      text;
  }


  function getPublishedRows(rows) {

    const now =
      Date.now();

    return (rows || [])
      .filter(row => {

        /*
         * The database already has an RLS policy limiting
         * public access to published updates.
         *
         * We still perform a client-side check so the UI
         * never displays a future-dated update if one is
         * returned by a privileged context.
         */
        if (row.published === false) {
          return false;
        }

        if (
          row.published_at &&
          new Date(row.published_at).getTime() > now
        ) {
          return false;
        }

        return true;
      })
      .sort((a, b) => {

        const dateA =
          new Date(
            a.published_at ||
            a.created_at ||
            0
          ).getTime();

        const dateB =
          new Date(
            b.published_at ||
            b.created_at ||
            0
          ).getTime();

        return dateB - dateA;
      });
  }


  /* ==========================================================
     RENDER
  ========================================================== */

  function renderUpdates(rows) {

    currentRows =
      getPublishedRows(rows);

    grid.setAttribute(
      "aria-busy",
      "false"
    );

    updatesCount.textContent =
      currentRows.length === 1
        ? "1 published update"
        : `${currentRows.length} published updates`;

    if (!currentRows.length) {

      grid.innerHTML = `
        <div class="card updates-empty">

          <h2>
            No updates yet.
          </h2>

          <p>
            CrowRules company updates will appear here
            as they are published.
          </p>

        </div>
      `;

      return;
    }


    grid.innerHTML =
      currentRows
        .map(row => {

          const priority =
            String(
              row.priority || "normal"
            ).toLowerCase();

          const type =
            row.update_type ||
            "Update";

          const division =
            row.division ||
            "";

          const project =
            row.project ||
            "";

          const description =
            row.description ||
            "";

          const link =
            row.link_url ||
            "";

          const date =
            row.published_at ||
            row.created_at;

          return `

            <article
              class="card update-card ${priorityClass(priority)}"
            >

              <div class="update-top">

                <div class="update-type">
                  ${esc(type)}
                </div>

                <div class="update-priority">
                  ${esc(priority)}
                </div>

              </div>

              <h2>
                ${esc(row.title || "Untitled Update")}
              </h2>

              <p class="update-description">
                ${esc(description)}
              </p>

              <div class="update-footer">

                <div class="update-context">

                  ${
                    division
                      ? `
                        <span class="update-tag">
                          ${esc(division)}
                        </span>
                      `
                      : ""
                  }

                  ${
                    project
                      ? `
                        <span class="update-tag">
                          ${esc(project)}
                        </span>
                      `
                      : ""
                  }

                </div>

                <time
                  class="update-date"
                  datetime="${esc(date || "")}"
                  title="${esc(formatDateTime(date))}"
                >
                  ${esc(formatDate(date))}
                </time>

              </div>

              ${
                link
                  ? `
                    <a
                      class="update-link"
                      href="${esc(link)}"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      Read more →
                    </a>
                  `
                  : ""
              }

            </article>

          `;

        })
        .join("");
  }


  /* ==========================================================
     LOADING
  ========================================================== */

  function showLoading() {

    grid.setAttribute(
      "aria-busy",
      "true"
    );

    grid.innerHTML = `

      <div class="updates-loading">

        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>

      </div>

    `;

    updatesCount.textContent =
      "Loading updates…";
  }


  /* ==========================================================
     LOAD FROM SUPABASE
  ========================================================== */

  async function loadUpdates() {

    if (!supabaseClient) {
      return;
    }

    refreshButton.disabled =
      true;

    setConnectionState(
      "loading",
      "Loading company updates"
    );

    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .from(TABLE)
          .select(`
            id,
            title,
            description,
            update_type,
            division,
            project,
            status,
            priority,
            link_url,
            published,
            published_at,
            created_at,
            updated_at
          `)
          .eq(
            "published",
            true
          )
          .or(
            "published_at.is.null,published_at.lte.now()"
          )
          .order(
            "published_at",
            {
              ascending: false,
              nullsFirst: false
            }
          );

      if (error) {
        throw error;
      }

      renderUpdates(
        data || []
      );

      setConnectionState(
        "live",
        "Live · Supabase connected"
      );

    } catch (error) {

      console.error(
        "CrowRules Updates:",
        error
      );

      grid.setAttribute(
        "aria-busy",
        "false"
      );

      grid.innerHTML = `

        <div class="card updates-error">

          <h2>
            Unable to load updates.
          </h2>

          <p>
            The CrowRules update feed could not
            be reached right now.
          </p>

        </div>

      `;

      updatesCount.textContent =
        "Feed unavailable";

      setConnectionState(
        "error",
        "Supabase connection error"
      );

    } finally {

      refreshButton.disabled =
        false;

    }
  }


  /* ==========================================================
     REALTIME
  ========================================================== */

  function subscribeToUpdates() {

    if (!supabaseClient) {
      return;
    }

    if (realtimeChannel) {

      supabaseClient
        .removeChannel(
          realtimeChannel
        );

    }

    realtimeChannel =
      supabaseClient
        .channel(
          "cr-updates-live-feed"
        )
        .on(
          "postgres_changes",
          {
            event: "*",
            schema: "public",
            table: TABLE
          },
          function (payload) {

            console.log(
              "CrowRules update change:",
              payload.eventType
            );

            /*
             * Reload the complete published feed rather than
             * trying to manually merge INSERT/UPDATE/DELETE
             * events. This keeps sorting and publication-date
             * filtering consistent.
             */
            loadUpdates();

          }
        )
        .subscribe(
          function (status) {

            console.log(
              "CrowRules Updates Realtime:",
              status
            );

          }
        );
  }


  /* ==========================================================
     INITIALIZE
  ========================================================== */

  async function initialize() {

    /*
     * Wait until the deferred Supabase library has loaded.
     */
    if (
      typeof window.supabase === "undefined"
    ) {

      setConnectionState(
        "error",
        "Supabase library unavailable"
      );

      grid.innerHTML = `

        <div class="card updates-error">

          <h2>
            Supabase unavailable.
          </h2>

          <p>
            The Supabase JavaScript client could not
            be loaded.
          </p>

        </div>

      `;

      return;
    }


    try {

      supabaseClient =
        window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );

      await loadUpdates();

      subscribeToUpdates();

    } catch (error) {

      console.error(
        "CrowRules initialization error:",
        error
      );

      setConnectionState(
        "error",
        "Initialization failed"
      );

    }

  }


  /* ==========================================================
     EVENTS
  ========================================================== */

  refreshButton.addEventListener(
    "click",
    function () {

      showLoading();

      loadUpdates();

    }
  );


  window.addEventListener(
    "beforeunload",
    function () {

      if (
        supabaseClient &&
        realtimeChannel
      ) {

        supabaseClient
          .removeChannel(
            realtimeChannel
          );

      }

    }
  );


  /*
   * The Supabase script is deferred, so DOMContentLoaded
   * occurs after it has loaded.
   */
  if (
    document.readyState === "loading"
  ) {

    document.addEventListener(
      "DOMContentLoaded",
      initialize
    );

  } else {

    initialize();

  }

})();
</script>


<script>
  /*
   * Keep the existing site footer from app.js.
   */
  document.write(
    typeof foot === "function"
      ? foot()
      : ""
  );
</script>

</body>
</html>
