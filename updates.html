<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowRules Updates</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></head><body><script>document.write(nav('updates'))</script><main class="wrap page"><div class="eyebrow">05 / COMPANY FEED</div><section class="hero"><h1>WHAT'S <span>MOVING.</span></h1><p class="lead">Development activity, launches, production milestones and company updates.</p></section><div class="grid g3" id="grid"></div></main><script>async function load(){let a=(await rows('cr_updates')).filter(x=>x.published!==false).sort((a,b)=>new Date(b.published_at||b.created_at)-new Date(a.published_at||a.created_at));grid.innerHTML=a.length?a.map(x=>`<article class="card"><div class="meta">${esc(x.update_type||'UPDATE')} · ${esc(x.priority||'NORMAL')}</div><h2>${esc(x.title)}</h2><p>${esc(x.description||'')}</p><div class="meta">${esc(x.division||'')} · ${esc(x.project||'')} · ${dt(x.published_at||x.created_at)}</div></article>`).join(''):'<div class="card"><h2>No updates yet.</h2></div>'}load();if(sb)sb.channel('updates-page').on('postgres_changes',{event:'*',schema:'public',table:'cr_updates'},load).subscribe();</script><script>document.write(foot())</script></body></html>
