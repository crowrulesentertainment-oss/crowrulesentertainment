<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowRules Partners</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></head><body><script>document.write(nav('partners'))</script><main class="wrap page"><div class="eyebrow">06 / PARTNERS</div><section class="hero"><h1>BUILD <span>TOGETHER.</span></h1><p class="lead">A dedicated partner directory for businesses, creators, organizations and community collaborators.</p></section><div class="grid g3" id="grid"></div></main><script>async function load(){let a=await rows('cr_partners');grid.innerHTML=a.length?a.map(x=>`<article class="card"><span class="tag">${esc(x.category||x.type||'PARTNER')}</span><h2>${esc(x.name||'Partner')}</h2><p>${esc(x.description||x.notes||'CrowRules partnership opportunity.')}</p>${x.website_url?`<a class="btn" target="_blank" rel="noopener" href="${esc(x.website_url)}">WEBSITE →</a>`:''}</article>`).join(''):'<div class="card"><h2>Partner directory ready.</h2><p>Add partners through the admin system.</p></div>'}load()</script><script>document.write(foot())</script></body></html>
