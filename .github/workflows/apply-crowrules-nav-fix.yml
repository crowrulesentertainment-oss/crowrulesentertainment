name: Apply CrowRules Navigation Fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add shared navigation fix stylesheet
        shell: bash
        run: |
          set -e
          changed=0
          for file in *.html; do
            [ -f "$file" ] || continue
            if grep -q 'assets/crowrules-global.js' "$file" && ! grep -q 'assets/crowrules-nav-fix.css' "$file"; then
              python3 - "$file" <<'PY'
import pathlib,sys
p=pathlib.Path(sys.argv[1])
s=p.read_text(encoding='utf-8')
needle='<link rel="stylesheet" href="assets/crowrules-global.css">'
s=s.replace(needle,needle+'\n  <link rel="stylesheet" href="assets/crowrules-nav-fix.css">',1)
p.write_text(s,encoding='utf-8')
PY
              changed=1
            fi
          done
          if [ "$changed" = "1" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add '*.html'
            git commit -m 'Hide legacy navigation under shared shell' || true
            git push
          fi
