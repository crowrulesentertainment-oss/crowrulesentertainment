name: Apply CrowRules Shared Shell

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add shared navigation shell to HTML pages
        shell: bash
        run: |
          set -e
          changed=0
          for file in *.html; do
            [ -f "$file" ] || continue
            if ! grep -q 'assets/crowrules-global.js' "$file"; then
              python3 - "$file" <<'PY'
import pathlib,sys
p=pathlib.Path(sys.argv[1])
s=p.read_text(encoding='utf-8')
needle='</body>'
insert='\n  <link rel="stylesheet" href="assets/crowrules-global.css">\n  <script src="assets/crowrules-global.js" defer></script>\n'
if needle in s:
    s=s.replace(needle,insert+needle,1)
    p.write_text(s,encoding='utf-8')
PY
              changed=1
            fi
          done
          if [ "$changed" = "1" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add '*.html'
            git commit -m 'Apply shared CrowRules navigation shell' || true
            git push
          fi
