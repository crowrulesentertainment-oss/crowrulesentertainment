<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CrowRules — Universal Account</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Orbitron:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/js/crowrules-sitewide.js?v=20261005" defer></script>
<style>
:root{--bg:#03040a;--panel:#0b101cf2;--cyan:#55e7ff;--purple:#a66cff;--text:#f5f7ff;--muted:#9da7bd}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:80px 20px;background:radial-gradient(circle at 20% 5%,#182441,#03040a 68%);color:var(--text);font-family:Montserrat,Arial}.wrap{max-width:560px;margin:auto}.hero{text-align:center;margin-bottom:25px}.eyebrow{font:700 11px Orbitron;letter-spacing:.28em;color:var(--cyan)}h1{font:800 clamp(32px,7vw,60px) Orbitron;margin:14px 0;background:linear-gradient(110deg,#fff,var(--cyan),var(--purple),#fff);-webkit-background-clip:text;color:transparent}.hero p{color:var(--muted);line-height:1.7}.card{background:var(--panel);border:1px solid #fff1;border-radius:24px;padding:26px;box-shadow:0 25px 80px #0009}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:18px}.tabs button{border:1px solid #fff1;border-radius:10px;padding:11px;background:#ffffff08;color:#9da7bd;font-weight:800;cursor:pointer}.tabs .active{color:#fff;background:#ffffff17}form{display:grid;gap:13px}label{font-size:11px;font-weight:800;text-transform:uppercase}input{display:block;width:100%;margin-top:7px;padding:13px;border:1px solid #fff2;border-radius:11px;background:#050811;color:#fff;font:14px Montserrat}input:focus{outline:none;border-color:#55e7ff77}.submit,.continue{width:100%;display:block;padding:14px;border:0;border-radius:11px;background:linear-gradient(135deg,#087e98,#654bb3);color:#fff;font-weight:800;cursor:pointer;text-align:center;text-decoration:none}.submit:disabled{opacity:.55}.status{display:none;padding:12px;border-radius:11px;margin-bottom:15px;font-size:13px;line-height:1.5}.status.show{display:block}.error{background:#ff174022;border:1px solid #ff6b8a44}.ok{background:#55e7ff12;border:1px solid #55e7ff44}.helper{text-align:center;color:#7f8aa2;font-size:11px;line-height:1.6;margin:15px 0}.links{text-align:center}.links a{color:#dfe8ff;font-size:11px;margin:0 6px}.logged{display:none;text-align:center}.logged.show{display:block}.avatar{width:76px;height:76px;margin:auto;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#087e98,#654bb3);font:800 22px Orbitron}.logged h2{font:800 21px Orbitron}.logged p{color:var(--muted);font-size:13px}.signout{margin-top:10px;padding:10px 15px;background:#ffffff08;border:1px solid #fff2;border-radius:10px;color:#fff;cursor:pointer}
</style>
</head>
<body><main class="wrap">
<section class="hero"><div class="eyebrow">ONE ACCOUNT. ONE UNIVERSE.</div><h1>CROWRULES ACCOUNT</h1><p>Sign in once with your universal CrowRules account. Successful authentication sends you directly to CrowRules Podcasting.</p></section>
<section class="card"><div id="status" class="status"></div>
<div id="auth"><div class="tabs"><button id="loginTab" class="active" type="button">SIGN IN</button><button id="signupTab" type="button">CREATE ACCOUNT</button></div>
<form id="form"><label>Email<input id="email" type="email" autocomplete="email" required></label><label>Password<input id="password" type="password" autocomplete="current-password" minlength="6" required></label><label id="confirmBox" hidden>Confirm Password<input id="confirm" type="password" autocomplete="new-password" minlength="6"></label><button id="submit" class="submit" type="submit">SIGN IN & CONTINUE TO PODCASTING</button></form>
<div id="helper" class="helper">Use your existing CrowRules universal account.</div><div class="links"><a href="https://crowrulesentertainment-oss.github.io/podcasting/">Podcasting Home</a><a href="https://crowrulesentertainment-oss.github.io/members/">Membership Center</a></div></div>
<div id="logged" class="logged"><div id="avatar" class="avatar">CR</div><h2 id="name">CROWRULES MEMBER</h2><p id="userEmail"></p><a class="continue" href="https://crowrulesentertainment-oss.github.io/podcasting/">CONTINUE TO PODCASTING</a><button id="signout" class="signout" type="button">SIGN OUT</button></div>
</section></main>
<script>
(()=>{const U="https://cevylpnoexugwgygvtgu.supabase.co",K="sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-",P="https://crowrulesentertainment-oss.github.io/podcasting/";const db=window.supabase?.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:"pkce",storageKey:"crowrules-universal-session-v1",storage:localStorage}}),$=x=>document.getElementById(x);let mode="login";
function notice(t,c="error"){$("status").textContent=t;$("status").className="status show "+c}function clear(){$("status").className="status"}
function setMode(m){mode=m;const s=m==="signup";$("loginTab").classList.toggle("active",!s);$("signupTab").classList.toggle("active",s);$("confirmBox").hidden=!s;$("password").autocomplete=s?"new-password":"current-password";$("submit").textContent=s?"CREATE ACCOUNT & CONTINUE TO PODCASTING":"SIGN IN & CONTINUE TO PODCASTING";clear()}
function showUser(u){$("auth").style.display="none";$("logged").classList.add("show");const n=u?.user_metadata?.full_name||u?.user_metadata?.name||u?.email?.split("@")[0]||"CrowRules Member";$("name").textContent=n.toUpperCase();$("userEmail").textContent=u?.email||"";$("avatar").textContent=n.slice(0,2).toUpperCase()}
function showAuth(){$("auth").style.display="block";$("logged").classList.remove("show")}
$("loginTab").onclick=()=>setMode("login");$("signupTab").onclick=()=>setMode("signup");
$("form").onsubmit=async e=>{e.preventDefault();clear();const email=$("email").value.trim(),password=$("password").value;if(mode==="signup"&&password!==$("confirm").value)return notice("Passwords do not match.");$("submit").disabled=true;try{const r=mode==="login"?await db.auth.signInWithPassword({email,password}):await db.auth.signUp({email,password,options:{emailRedirectTo:location.href}});if(r.error)throw r.error;if(mode==="signup"&&!r.data?.session){notice("Account created. Check your email to confirm the account, then return here and sign in.","ok");setMode("login");$("password").value="";$("confirm").value="";return}if(r.data?.session){showUser(r.data.user);notice("Signed in. Returning to Podcasting…","ok");setTimeout(()=>location.assign(P),700)}}catch(err){notice(err?.message||"Authentication failed. Please try again.")}finally{$("submit").disabled=false}};
$("signout").onclick=async()=>{await db.auth.signOut({scope:"global"});showAuth();clear()};
async function init(){if(!db)return notice("CrowRules authentication could not start. Please refresh.");const r=await db.auth.getSession();if(r.data?.session?.user)showUser(r.data.session.user)}
db?.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_OUT")showAuth();if(event==="SIGNED_IN"&&session?.user)showUser(session.user)});init()})();
</script></body></html>
