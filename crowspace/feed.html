<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowFeed 2.1 | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"></head><body data-active="feed"><main class="wrap hero"><div class="eyebrow">CROWFEED · COMMUNITY PULSE</div><h1>What's<br><span>Happening?</span></h1><div class="grid2"><section><div class="card form"><div class="form-label">SHARE WITH CROWSPACE</div><textarea id="content" maxlength="10000" placeholder="What's happening? Share an idea, milestone, question or update."></textarea><div class="composer-foot"><span id="count" class="meta">0 / 10000</span><button class="btn red" id="post">POST UPDATE</button></div></div><div id="feed-list" class="section"></div></section><aside><div class="card"><div class="eyebrow">CROWFEED</div><h2>Share.<br><span>Connect.</span><br>Build.</h2><p class="muted">Your public community feed is connected to your CrowRules identity.</p><div class="actions"><a class="btn" href="discover.html">DISCOVER</a><a class="btn" href="groups.html">GROUPS</a></div></div><div class="card section"><div class="eyebrow">YOUR TOOLS</div><p><a class="text-link" href="my-space.html">MY SPACE →</a></p><p><a class="text-link" href="friends.html">FRIENDS →</a></p><p><a class="text-link" href="projects.html">PROJECTS →</a></p></div></aside></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/app.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const u=await auth();if(!u)return;const input=$("#content");input.oninput=()=>$("#count").textContent=input.value.length+" / 10000";await feed();$("#post").onclick=async()=>{const member=await ensureMember(u),body=input.value.trim();if(!member||!body)return;const r=await db.from("crowspace_posts").insert({author_id:member.id,body,visibility:"public",status:"published"});if(r.error)alert(r.error.message);else{input.value="";$("#count").textContent="0 / 10000";await feed()}}});</script></body></html>
