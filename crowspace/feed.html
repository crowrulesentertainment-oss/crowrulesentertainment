<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowFeed</title><link rel="stylesheet" href="css/crowspace.css"></head><body data-active="feed"><main class="wrap hero"><div class="eyebrow">CROWFEED</div><h1>What's<br><span>Happening?</span></h1><div class="grid2"><section><div class="card form"><textarea id="content" placeholder="What's happening?"></textarea><button class="btn red" id="post">POST UPDATE</button></div><div id="feed-list" class="section"></div></section><aside class="card"><h3>CROWFEED</h3><p class="muted">Public community updates.</p></aside></div></main><script>document.addEventListener('DOMContentLoaded',()=>{feed();document.querySelector('#post').onclick=async()=>{const u=await auth();if(!u)return;const c=document.querySelector('#content').value.trim();if(!c)return;const r=await db.from('crowspace_posts').insert({author_id:u.id,content:c,visibility:'public'});if(r.error)alert(r.error.message);else{document.querySelector('#content').value='';feed()}}})</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/app.js"></script></body></html>
