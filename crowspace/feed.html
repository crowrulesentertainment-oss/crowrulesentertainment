<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowFeed | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"></head><body data-active="feed"><main class="wrap hero"><div class="eyebrow">CROWFEED</div><h1>What's<br><span>Happening?</span></h1><div class="grid2"><section><div class="card form"><div class="form-label">SHARE WITH CROWSPACE</div><textarea id="content" maxlength="10000" placeholder="What's happening?"></textarea><button class="btn red" id="post">POST UPDATE</button></div><div id="feed-list" class="section"></div></section><aside class="card"><h2>Share. Connect. Build.</h2><p class="muted">Public community updates connected to your CrowRules identity.</p><a class="btn" href="../membership.html">UNIVERSAL MEMBERSHIP</a></aside></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/app.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const u=await auth();if(!u)return;await feed();document.querySelector("#post").onclick=async()=>{const member=await ensureMember(u),body=document.querySelector("#content").value.trim();if(!member||!body)return;const r=await db.from("crowspace_posts").insert({author_id:member.id,body,visibility:"public",status:"published"});if(r.error)alert(r.error.message);else{document.querySelector("#content").value="";await feed()}}})</script></body></html>
