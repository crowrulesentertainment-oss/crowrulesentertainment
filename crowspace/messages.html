<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"></head><body data-active="messages"><main class="wrap hero"><div class="eyebrow">CROW MESSAGES</div><h1>Private<br><span>Conversations.</span></h1><div class="grid2"><section><div class="card form"><input id="recipient" placeholder="Recipient username"><textarea id="message" maxlength="5000" placeholder="Write a private message..."></textarea><button class="btn red" id="send">SEND MESSAGE</button><div id="send-status" class="muted"></div></div><div id="list" class="section"></div></section><aside class="card"><h2>Private Conversations</h2><p class="muted">Messages are protected by Supabase Row Level Security.</p></aside></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/app.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const u=await auth();if(!u)return;async function load(){const q=(await db.from("crowspace_messages").select("sender_id,recipient_id,content,created_at").or(`sender_id.eq.${u.id},recipient_id.eq.${u.id}`).order("created_at",{ascending:false}).limit(50)).data||[];document.querySelector("#list").innerHTML=q.map(x=>`<div class="row"><div><strong>${x.sender_id===u.id?"You":"Incoming"}</strong><div>${esc(x.content)}</div><div class="meta">${new Date(x.created_at).toLocaleString()}</div></div></div>`).join("")||'<div class="empty">No messages yet.</div>'}await load();document.querySelector("#send").onclick=async()=>{const name=document.querySelector("#recipient").value.trim(),content=document.querySelector("#message").value.trim();if(!name||!content)return;const p=(await db.from("crowspace_profiles").select("user_id").eq("username",name).maybeSingle()).data;if(!p){document.querySelector("#send-status").textContent="CrowSpace user not found.";return}const r=await db.from("crowspace_messages").insert({sender_id:u.id,recipient_id:p.user_id,content});document.querySelector("#send-status").textContent=r.error?r.error.message:"Message sent.";if(!r.error){document.querySelector("#message").value="";await load()}}})</script></body></html>
