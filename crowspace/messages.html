<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"></head><body data-active="messages"><main class="wrap hero"><div class="eyebrow">CROW MESSAGES · PRIVATE</div><h1>Private<br><span>Conversations.</span></h1><div class="grid2"><section><div class="card form"><input id="recipient" placeholder="Recipient username"><textarea id="message" maxlength="5000" placeholder="Write a private message..."></textarea><button class="btn red" id="send">SEND MESSAGE</button><div id="send-status" class="muted"></div></div><div id="list" class="section"></div></section><aside class="card"><h2>Private</h2><p class="muted">Only the sender and recipient can read a message. Messages use CrowRules authentication and Row Level Security.</p></aside></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/app.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const u=await auth();if(!u)return;async function load(){const q=await db.from("crowspace_messages").select("id,sender_id,recipient_id,content,created_at,is_read").or("sender_id.eq."+u.id+",recipient_id.eq."+u.id).order("created_at",{ascending:false}).limit(100);if(q.error){document.querySelector("#list").innerHTML='<div class="empty">'+esc(q.error.message)+'</div>';return}const ids=[...new Set((q.data||[]).flatMap(x=>[x.sender_id,x.recipient_id]).filter(x=>x!==u.id))],ps=ids.length?(await db.from("crowspace_profiles").select("user_id,username,display_name").in("user_id",ids)).data||[]:[],map=Object.fromEntries(ps.map(x=>[x.user_id,x]));document.querySelector("#list").innerHTML=(q.data||[]).map(x=>'<div class="row"><div><strong>'+esc(x.sender_id===u.id?"You":map[x.sender_id]?.display_name||"Crow")+'</strong><div>'+esc(x.content)+'</div><div class="meta">'+new Date(x.created_at).toLocaleString()+(x.recipient_id===u.id&&!x.is_read?" · NEW":"")+'</div></div></div>').join("")||'<div class="empty">No messages yet.</div>';await db.from("crowspace_messages").update({is_read:true}).eq("recipient_id",u.id).eq("is_read",false)}await load();document.querySelector("#send").onclick=async()=>{const name=document.querySelector("#recipient").value.trim().toLowerCase(),content=document.querySelector("#message").value.trim();if(!name||!content)return;const p=await db.from("crowspace_profiles").select("user_id").eq("username",name).maybeSingle();if(p.error||!p.data){document.querySelector("#send-status").textContent="CrowSpace user not found.";return}if(p.data.user_id===u.id){document.querySelector("#send-status").textContent="You cannot message yourself.";return}const r=await db.from("crowspace_messages").insert({sender_id:u.id,recipient_id:p.data.user_id,content});document.querySelector("#send-status").textContent=r.error?r.error.message:"Message sent.";if(!r.error){document.querySelector("#message").value="";await load()}}});</script></body></html>
