<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages | CrowSpace 2.3</title><link rel="stylesheet" href="css/crowspace.css"></head><body data-active="messages"><main class="wrap hero"><div class="eyebrow">CROWSPACE 2.3 · MESSAGES</div><h1>Private<br><span>Conversations.</span></h1><div class="grid2"><section><div class="card form"><input id="recipient" placeholder="Recipient username"><textarea id="message" maxlength="5000" placeholder="Write a private message…"></textarea><button class="btn red" id="send">SEND MESSAGE</button><div id="send-status" class="muted"></div></div><div id="list" class="section"></div></section><aside><div class="card"><div class="eyebrow">REAL-TIME</div><h2>Talk in <span>real time.</span></h2><p class="muted">New messages can appear automatically while this page is open.</p></div></aside></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/app.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const u=await auth();if(!u)return;async function load(){const q=await db.from("crowspace_messages").select("id,sender_id,recipient_id,content,created_at,is_read").or("sender_id.eq."+u.id+",recipient_id.eq."+u.id).order("created_at",{ascending:false}).limit(100);if(q.error){$("#list").innerHTML='<div class="empty">'+esc(q.error.message)+'</div>';return}const ids=[...new Set((q.data||[]).flatMap(x=>[x.sender_id,x.recipient_id]).filter(x=>x!==u.id))],ps=ids.length?(await db.from("crowspace_profiles").select("user_id,username,display_name").in("user_id",ids)).data||[]:[],map=Object.fromEntries(ps.map(x=>[x.user_id,x]));$("#list").innerHTML=(q.data||[]).map(x=>'<article class="card"><div class="eyebrow">'+(x.sender_id===u.id?"YOU":"MESSAGE")+'</div><h3>'+esc(x.sender_id===u.id?"You":map[x.sender_id]?.display_name||"Crow")+'</h3><p>'+esc(x.content)+'</p><div class="meta">'+new Date(x.created_at).toLocaleString()+(x.recipient_id===u.id&&!x.is_read?" · NEW":"")+'</div></article>').join("")||'<div class="empty">No messages yet.</div>';if((q.data||[]).some(x=>x.recipient_id===u.id&&!x.is_read))await db.from("crowspace_messages").update({is_read:true}).eq("recipient_id",u.id).eq("is_read",false)}await load();$("#send").onclick=async()=>{const name=$("#recipient").value.trim().toLowerCase(),content=$("#message").value.trim();if(!name||!content)return;const p=await db.from("crowspace_profiles").select("user_id").eq("username",name).maybeSingle();if(p.error||!p.data){$("#send-status").textContent="CrowSpace user not found.";return}const r=await db.rpc("crowspace_send_message",{target_user:p.data.user_id,message_body:content});$("#send-status").textContent=r.error?r.error.message:"Message sent.";if(!r.error){$("#message").value="";load()}};db.channel("crowspace-messages-"+u.id).on("postgres_changes",{event:"INSERT",schema:"public",table:"crowspace_messages",filter:"recipient_id=eq."+u.id},()=>load()).subscribe()});</script></body></html>
