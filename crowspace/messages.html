<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace Messages</title><link rel="stylesheet" href="css/crowspace.css"></head><body><main class="wrap hero"><div class="eyebrow">CROW MESSAGES</div><h1>Private<br><span>Conversations.</span></h1><div class="card"><div id="list" class="list"></div><div class="notice">Messaging storage is connected in Supabase. Composer UI can be added next without changing the database.</div></div></main><script>document.addEventListener('DOMContentLoaded',async()=>{const u=await auth();if(!u)return;const q=(await db.from('crowspace_messages').select('sender_id,content,created_at').or('sender_id.eq.'+u.id+',recipient_id.eq.'+u.id).order('created_at',{ascending:false}).limit(50)).data||[];document.querySelector('#list').innerHTML=q.map(x=>'<div class="row"><div><strong>'+ (x.sender_id===u.id?'You':'Incoming') +'</strong><div>'+esc(x.content)+'</div><div class="meta">'+new Date(x.created_at).toLocaleString()+'</div></div></div>').join('')||'<div class="empty">No messages yet.</div>'})</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/app.js"></script></body></html>
