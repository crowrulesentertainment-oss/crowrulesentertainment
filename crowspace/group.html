<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="CrowSpace group community feed."><title>Group Feed | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"></head><body data-active="groups"><main class="wrap hero"><div id="head"></div><div id="composer" class="card form" hidden><div class="form-label">POST TO THIS GROUP</div><textarea id="content" maxlength="5000" placeholder="Share with the group…"></textarea><div class="composer-foot"><span id="status" class="meta">0 / 5000</span><button class="btn red" id="post" type="button">POST</button></div></div><div id="feed-list" class="section"><div class="empty">Loading group…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/app.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const u=await auth();if(!u)return;const id=new URLSearchParams(location.search).get("id");if(!id){$("#feed-list").innerHTML='<div class="empty">Group not specified.</div>';return}const g=await db.from("crowspace_groups").select("id,name,slug,description,visibility,status").eq("id",id).maybeSingle();if(g.error||!g.data){$("#feed-list").innerHTML='<div class="empty">Group not found.</div>';return}let isMember=false;async function load(){const m=await db.from("crowspace_group_members").select("group_id").eq("group_id",id).eq("user_id",u.id).eq("status","active").maybeSingle();isMember=!!m.data;$("#head").innerHTML='<div class="eyebrow">CROWSPACE GROUP · '+esc(g.data.visibility)+'</div><h1>'+esc(g.data.name)+'<br><span>Community Feed.</span></h1><p class="hero-copy">'+esc(g.data.description||"")+'</p><div class="actions"><a class="btn" href="groups.html">ALL GROUPS</a><button class="btn '+(isMember?"":"red")+'" id="toggle" type="button">'+(isMember?"LEAVE GROUP":"JOIN GROUP")+'</button></div>';$("#composer").hidden=!isMember;const r=await db.from("crowspace_posts").select("id,author_id,body,media_url,media_type,like_count,comment_count,created_at").eq("group_id",id).eq("status","published").order("created_at",{ascending:false});if(r.error){$("#feed-list").innerHTML='<div class="empty">'+esc(r.error.message)+'</div>';return}await renderPostRows($("#feed-list"),r.data||[],u,{empty:"No group posts yet. Be the first to start the conversation."});$("#toggle").onclick=async()=>{const z=await db.rpc("crowspace_toggle_group_membership",{target_group:id});if(z.error)alert(z.error.message);else load()}}await load();const input=$("#content");input?.addEventListener("input",()=>$("#status").textContent=input.value.length+" / 5000");$("#post")?.addEventListener("click",async()=>{if(!isMember){alert("Join the group before posting.");return}const body=input.value.trim();if(!body)return;const r=await db.rpc("crowspace_create_group_post",{target_group:id,post_body:body});if(r.error){alert(r.error.message);return}input.value="";$("#status").textContent="0 / 5000";load()})});</script></body></html>
