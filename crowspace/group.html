<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Group Feed | CrowSpace 2.3</title><link rel="stylesheet" href="css/crowspace.css"></head><body data-active="groups"><main class="wrap hero"><div id="head"></div><div class="card form"><div class="form-label">POST TO THIS GROUP</div><textarea id="content" maxlength="5000" placeholder="Share with the group…"></textarea><button class="btn red" id="post">POST</button></div><div id="feed-list" class="section"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/app.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const u=await auth();if(!u)return;const id=new URLSearchParams(location.search).get("id");if(!id){$("#feed-list").innerHTML='<div class="empty">Group not specified.</div>';return}const g=await db.from("crowspace_groups").select("*").eq("id",id).maybeSingle();if(g.error||!g.data){$("#feed-list").innerHTML='<div class="empty">Group not found.</div>';return}const member=await db.from("crowspace_group_members").select("group_id").eq("group_id",id).eq("user_id",u.id).maybeSingle();$("#head").innerHTML='<div class="eyebrow">CROWSPACE GROUP</div><h1>'+esc(g.data.name)+'<br><span>Community Feed.</span></h1><p class="hero-copy">'+esc(g.data.description||"")+'</p><div class="actions"><a class="btn" href="groups.html">ALL GROUPS</a><button class="btn red" id="toggle">'+(member.data?"LEAVE GROUP":"JOIN GROUP")+'</button></div>';async function load(){const r=await db.from("crowspace_posts").select("id,author_id,body,media_url,like_count,comment_count,created_at").eq("group_id",id).eq("status","published").order("created_at",{ascending:false});if(r.error){$("#feed-list").innerHTML='<div class="empty">'+esc(r.error.message)+'</div>';return}const posts=r.data||[],ids=[...new Set(posts.map(x=>x.author_id))],ps=ids.length?(await db.from("crowspace_members").select("id,display_name,username,avatar_url").in("id",ids)).data||[]:[],map=Object.fromEntries(ps.map(x=>[x.id,x]));$("#feed-list").innerHTML=posts.map(x=>{const p=map[x.author_id]||{};return '<article class="card post"><div class="profile-head">'+avatar(p.avatar_url,p.display_name,"avatar mini")+'<div><strong>'+esc(p.display_name||p.username||"Crow")+'</strong><div class="meta">@'+esc(p.username||"crow")+' · '+new Date(x.created_at).toLocaleString()+'</div></div></div><p>'+esc(x.body)+'</p>'+(x.media_url?'<img class="post-media" src="'+esc(x.media_url)+'">':"")+'<div class="meta">♥ '+Number(x.like_count||0)+' · 💬 '+Number(x.comment_count||0)+'</div></article>'}).join("")||'<div class="empty">No group posts yet.</div>'}$("#toggle").onclick=async()=>{const r=await db.rpc("crowspace_toggle_group_membership",{target_group:id});if(r.error)alert(r.error.message);else location.reload()};$("#post").onclick=async()=>{const m=await ensureMember(u),body=$("#content").value.trim();if(!m||!body)return;const r=await db.from("crowspace_posts").insert({author_id:m.id,group_id:id,body,visibility:"public",status:"published"});if(r.error)alert(r.error.message);else{$("#content").value="";load()}};load()});</script></body></html>
