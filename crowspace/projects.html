<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace Projects</title><link rel="stylesheet" href="css/crowspace.css"></head><body data-active="projects"><main class="wrap hero"><div class="eyebrow">PROJECTS</div><h1>Build It<br><span>Together.</span></h1><div class="grid2"><section><div class="card form"><input id="title" placeholder="Project title"><input id="category" placeholder="Category"><select id="status"><option value="idea">Idea</option><option value="planning">Planning</option><option value="development">In Development</option><option value="production">Production</option><option value="completed">Completed</option></select><textarea id="description" placeholder="Description"></textarea><button class="btn red" id="create">CREATE PROJECT</button></div><div id="list" class="section"></div></section><aside class="card"><h3>IDEA → PROJECT</h3><p class="muted">The collaboration layer of CrowSpace v1.0.</p></aside></div></main><script>async function load(){const q=(await db.from('crowspace_projects').select('title,category,status,description').order('created_at',{ascending:false})).data||[];document.querySelector('#list').innerHTML=q.map(x=>'<div class="card"><h3>'+esc(x.title)+'</h3><div class="meta">'+esc(x.category||'Project')+' · '+esc(x.status)+'</div><p class="muted">'+esc(x.description||'')+'</p></div>').join('')||'<div class="empty">Create the first project.</div>}document.addEventListener('DOMContentLoaded',async()=>{const u=await auth();if(!u)return;load();document.querySelector('#create').onclick=async()=>{const r=await db.from('crowspace_projects').insert({owner_id:u.id,title:document.querySelector('#title').value.trim(),category:document.querySelector('#category').value.trim(),status:document.querySelector('#status').value,description:document.querySelector('#description').value.trim()});if(r.error)alert(r.error.message);else load()}})</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/app.js"></script></body></html>
