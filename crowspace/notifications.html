<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activity | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"></head><body data-active="notifications"><main class="wrap hero"><div class="eyebrow">CROWSPACE ACTIVITY</div><h1>Your Crow<br><span>Activity.</span></h1><div class="actions"><button class="btn" id="read">MARK ALL READ</button></div><div id="list" class="list section"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/app.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const u=await auth();if(!u)return;async function load(){const q=await db.from("crowspace_notifications").select("id,type,message,created_at,is_read,actor_id,reference_id").eq("user_id",u.id).order("created_at",{ascending:false}).limit(100);if(q.error){document.querySelector("#list").innerHTML='<div class="empty">'+esc(q.error.message)+'</div>';return}document.querySelector("#list").innerHTML=(q.data||[]).map(x=>'<div class="row '+(x.is_read?"":"unread")+'"><div><strong>'+esc(x.type)+'</strong><div>'+esc(x.message||"CrowSpace activity")+'</div><div class="meta">'+new Date(x.created_at).toLocaleString()+'</div></div>'+(!x.is_read?'<button class="btn small" data-read="'+x.id+'">READ</button>':"")+'</div>').join("")||'<div class="empty">No notifications yet.</div>';document.querySelectorAll("[data-read]").forEach(b=>b.onclick=async()=>{const z=await db.rpc("crowspace_mark_notifications_read",{notification_id:b.dataset.read});if(z.error)alert(z.error.message);else load()})}await load();document.querySelector("#read").onclick=async()=>{const z=await db.rpc("crowspace_mark_notifications_read",{notification_id:null});if(z.error)alert(z.error.message);else load()}});</script></body></html>
