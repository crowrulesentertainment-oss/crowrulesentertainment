<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activity | CrowSpace 2.3</title><link rel="stylesheet" href="css/crowspace.css"></head><body data-active="notifications"><main class="wrap hero"><div class="eyebrow">CROWSPACE 2.3 · ACTIVITY TIMELINE</div><h1>Your Crow<br><span>Activity.</span></h1><p class="hero-copy">One timeline for messages, connections, reactions and everything happening around your Space.</p><div class="actions"><button class="btn red" id="all">ALL</button><button class="btn" id="unread">UNREAD</button><button class="btn" id="read">MARK ALL READ</button></div><div id="list" class="section"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/app.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const u=await auth();if(!u)return;let mode="all";async function load(){const q=await db.from("crowspace_notifications").select("id,type,message,created_at,is_read,actor_id,reference_id").eq("user_id",u.id).order("created_at",{ascending:false}).limit(150);if(q.error){$("#list").innerHTML='<div class="empty">'+esc(q.error.message)+'</div>';return}let rows=q.data||[];if(mode==="unread")rows=rows.filter(x=>!x.is_read);$("#list").innerHTML=rows.map(x=>'<article class="card '+(x.is_read?"":"notification-unread")+'"><div class="profile-head"><div class="membership-mark">'+esc((x.type||"ACT").slice(0,2).toUpperCase())+'</div><div><strong>'+esc(x.type||"activity")+'</strong><div class="meta">'+new Date(x.created_at).toLocaleString()+'</div></div></div><p>'+esc(x.message||"CrowSpace activity")+'</p>'+(!x.is_read?'<button class="btn small" data-read="'+x.id+'">MARK READ</button>':"")+'</article>').join("")||'<div class="empty">No activity here yet.</div>';document.querySelectorAll("[data-read]").forEach(b=>b.onclick=async()=>{const z=await db.rpc("crowspace_mark_notifications_read",{notification_id:b.dataset.read});if(z.error)alert(z.error.message);else load()})}$("#all").onclick=()=>{mode="all";load()};$("#unread").onclick=()=>{mode="unread";load()};$("#read").onclick=async()=>{const z=await db.rpc("crowspace_mark_notifications_read",{notification_id:null});if(z.error)alert(z.error.message);else load()};await load();db.channel("crowspace-activity-"+u.id).on("postgres_changes",{event:"INSERT",schema:"public",table:"crowspace_notifications",filter:"user_id=eq."+u.id},()=>load()).subscribe()});</script></body></html>
