<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace Notifications</title><link rel="stylesheet" href="css/crowspace.css"></head><body data-active="notifications"><main class="wrap hero"><div class="eyebrow">NOTIFICATIONS</div><h1>Your Crow<br><span>Activity.</span></h1><div id="list" class="list"></div></main><script>document.addEventListener('DOMContentLoaded',async()=>{const u=await auth();if(!u)return;const q=(await db.from('crowspace_notifications').select('type,message,created_at').eq('user_id',u.id).order('created_at',{ascending:false}).limit(50)).data||[];document.querySelector('#list').innerHTML=q.map(x=>'<div class="row"><div><strong>'+esc(x.type)+'</strong><div>'+esc(x.message||'CrowSpace activity')+'</div><div class="meta">'+new Date(x.created_at).toLocaleString()+'</div></div></div>').join('')||'<div class="empty">No notifications yet.</div>'})</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/app.js"></script></body></html>
