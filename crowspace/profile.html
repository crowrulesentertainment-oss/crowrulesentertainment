<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace Profile</title><link rel="stylesheet" href="css/crowspace.css"></head><body><main class="wrap hero"><div id="profile"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/app.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const username=new URLSearchParams(location.search).get("u");if(!username){location.href="discover.html";return}const pr=await db.from("crowspace_profiles").select("*").eq("username",username).maybeSingle();if(pr.error||!pr.data){document.querySelector("#profile").innerHTML='<div class="empty">CrowSpace not found.</div>';return}const p=pr.data,s=await getSession(),m=s?await membership(s.user):null,other=!!s&&s.user.id!==p.user_id;let state=null;if(other){const r=await db.from("crowspace_friends").select("requester_id,recipient_id,status").or("requester_id.eq."+s.user.id+",recipient_id.eq."+s.user.id);state=(r.data||[]).find(x=>(x.requester_id===s.user.id&&x.recipient_id===p.user_id)||(x.requester_id===p.user_id&&x.recipient_id===s.user.id))||null}const label=state?.status==="accepted"?"FRIENDS":state?.status==="pending"?(state.requester_id===s.user.id?"REQUEST SENT":"ACCEPT REQUEST"):"ADD FRIEND";const member=(await db.from("crowspace_members").select("id").eq("user_id",p.user_id).maybeSingle()).data;document.querySelector("#profile").innerHTML='<section class="profile-banner" style="background-image:url(\''+esc(p.banner_url||"")+'\')"><div class="profile-overlay"><div class="profile-head">'+avatar(p.avatar_url,p.display_name||p.username,"avatar xlarge")+'<div><div class="eyebrow">CROWSPACE PROFILE</div><h1>'+esc(p.display_name||p.username||"Crow")+'</h1><div class="muted">@'+esc(p.username||"")+'</div></div></div></div></section><div class="card profile-card"><p>'+esc(p.bio||"")+'</p><div class="profile-meta"><span>📍 '+esc(p.location||"Not listed")+'</span>'+(p.website_url?'<a href="'+esc(p.website_url)+'" target="_blank" rel="noopener">🌐 Website</a>':"")+'</div>'+(s?'<div id="membership"></div>':"")+'<div class="actions">'+(other?'<button class="btn red" id="follow">FOLLOW</button><button class="btn" id="friend">'+label+'</button>':"")+'</div></div><section class="section"><div class="label">PUBLIC ACTIVITY</div><div id="profile-feed"></div><div class="label">GUESTBOOK</div>'+(s?'<div class="card form"><textarea id="guest" maxlength="2000" placeholder="Leave a message..."></textarea><button class="btn" id="guestbtn">SIGN GUESTBOOK</button></div>':"")+'<div id="guest-list" class="list"></div></section>';if(s)await renderMembership("#membership",s.user);if(other){$("#follow").onclick=async()=>{const r=await db.from("crowspace_follows").upsert({follower_id:s.user.id,following_id:p.user_id});if(r.error)alert(r.error.message);else $("#follow").textContent="FOLLOWING"};$("#friend").onclick=async()=>{const r=await db.rpc("crowspace_send_friend_request",{target_user_id:p.user_id});if(r.error)alert(r.error.message);else $("#friend").textContent=r.data?.status==="accepted"?"FRIENDS":"REQUEST SENT"}}$("#guestbtn")?.addEventListener("click",async()=>{const message=$("#guest").value.trim();if(!message)return;const r=await db.from("crowspace_guestbook").insert({profile_id:p.user_id,author_id:s.user.id,message});if(r.error)alert(r.error.message);else location.reload()});const g=(await db.from("crowspace_guestbook").select("message,created_at").eq("profile_id",p.user_id).eq("status","approved").order("created_at",{ascending:false})).data||[];$("#guest-list").innerHTML=g.map(x=>'<div class="card"><div class="meta">'+new Date(x.created_at).toLocaleString()+'</div><p>'+esc(x.message)+'</p></div>').join("")||'<div class="empty">No guestbook messages yet.</div>';if(member)await renderFeed($("#profile-feed"),s?.user,20,member.id)});</script></body></html>
