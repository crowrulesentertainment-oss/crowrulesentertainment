<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace Profile</title><link rel="stylesheet" href="css/crowspace.css"></head>
<body><main class="wrap hero"><div id="profile"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/app.js"></script>
<script>
document.addEventListener("DOMContentLoaded",async()=>{
 const username=new URLSearchParams(location.search).get("u"); if(!username){location.href="discover.html";return}
 const pr=await db.from("crowspace_profiles").select("*").eq("username",username).maybeSingle(),p=pr.data;
 if(!p){document.querySelector("#profile").innerHTML='<div class="empty">CrowSpace not found.</div>';return}
 const s=await getSession(),m=s?await membership(s.user):null,other=s&&s.user.id!==p.user_id;
 let friendState=null;
 if(other){
   const r=await db.from("crowspace_friends").select("requester_id,recipient_id,status").or(`requester_id.eq.${s.user.id},recipient_id.eq.${s.user.id}`);
   friendState=(r.data||[]).find(x=>(x.requester_id===s.user.id&&x.recipient_id===p.user_id)||(x.requester_id===p.user_id&&x.recipient_id===s.user.id))||null;
 }
 let friendLabel="ADD FRIEND";
 if(friendState?.status==="accepted") friendLabel="FRIENDS";
 else if(friendState?.status==="pending") friendLabel=friendState.requester_id===s.user.id?"REQUEST SENT":"ACCEPT REQUEST";
 document.querySelector("#profile").innerHTML=`<div class="card profile-card"><div class="profile-head"><img class="avatar large" src="${esc(p.avatar_url||"")}" alt=""><div><div class="eyebrow">CROWSPACE PROFILE</div><h1>${esc(p.display_name||p.username||"Crow")}</h1><div class="muted">@${esc(p.username||"")}</div></div></div><p>${esc(p.bio||"")}</p>${s?`<div class="membership-badge"><div class="membership-mark">CR</div><div class="membership-info"><strong>UNIVERSAL CROWRULES MEMBER</strong><span>${esc(m?.membership_plans?.name||"CROW")}</span></div></div>`:""}<div class="actions">${other?'<button class="btn red" id="follow">FOLLOW</button><button class="btn" id="friend"></button>':""}</div></div><section class="section"><div class="label">GUESTBOOK</div>${s?'<div class="card form"><textarea id="guest" maxlength="2000" placeholder="Leave a message..."></textarea><button class="btn" id="guestbtn">SIGN GUESTBOOK</button></div>':'<div class="card"><p class="muted">Sign in to interact with this Space.</p><a class="btn red" href="../login.html">SIGN IN</a></div>'}<div id="guest-list" class="list"></div></section>`;
 if(other){
   document.querySelector("#friend").textContent=friendLabel;
   document.querySelector("#follow").onclick=async()=>{const r=await db.from("crowspace_follows").upsert({follower_id:s.user.id,following_id:p.user_id});if(r.error)alert(r.error.message);else document.querySelector("#follow").textContent="FOLLOWING"};
   document.querySelector("#friend").onclick=async()=>{
     const r=await db.rpc("crowspace_send_friend_request",{target_user_id:p.user_id});
     if(r.error){alert(r.error.message);return}
     const result=r.data||{}; document.querySelector("#friend").textContent=result.status==="accepted"?"FRIENDS":result.status==="pending"?"REQUEST SENT":"ADD FRIEND";
     alert(result.message||"Friend request updated.");
   };
 }
 document.querySelector("#guestbtn")?.addEventListener("click",async()=>{const me=await auth(),message=document.querySelector("#guest").value.trim();if(!me||!message)return;const r=await db.from("crowspace_guestbook").insert({profile_id:p.user_id,author_id:me.id,message});if(r.error)alert(r.error.message);else location.reload()});
 const g=(await db.from("crowspace_guestbook").select("message,created_at").eq("profile_id",p.user_id).eq("status","approved").order("created_at",{ascending:false})).data||[];
 document.querySelector("#guest-list").innerHTML=g.map(x=>`<div class="card"><div class="meta">${new Date(x.created_at).toLocaleString()}</div><p>${esc(x.message)}</p></div>`).join("")||'<div class="empty">No guestbook messages yet.</div>';
});
</script></body></html>
