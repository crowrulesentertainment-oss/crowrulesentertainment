<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace Creator Profile 2.3</title><link rel="stylesheet" href="css/crowspace.css"></head><body><main class="wrap hero"><div id="profile"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/app.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const username=new URLSearchParams(location.search).get("u");if(!username){location.href="discover.html";return}const pr=await db.from("crowspace_profiles").select("*").eq("username",username).maybeSingle();if(pr.error||!pr.data){$("#profile").innerHTML='<div class="empty">CrowSpace creator not found.</div>';return}const p=pr.data,s=await getSession(),m=s?await membership(s.user):null,other=!!s&&s.user.id!==p.user_id,member=(await db.from("crowspace_members").select("id").eq("user_id",p.user_id).maybeSingle()).data;let state=null;if(other){const r=await db.from("crowspace_friends").select("requester_id,recipient_id,status").or("requester_id.eq."+s.user.id+",recipient_id.eq."+s.user.id);state=(r.data||[]).find(x=>(x.requester_id===s.user.id&&x.recipient_id===p.user_id)||(x.requester_id===p.user_id&&x.recipient_id===s.user.id))||null}const label=state?.status==="accepted"?"FRIENDS":state?.status==="pending"?(state.requester_id===s.user.id?"REQUEST SENT":"ACCEPT REQUEST"):"ADD FRIEND";$("#profile").innerHTML='<section class="profile-banner" style="background-image:url(\''+esc(p.banner_url||"")+'\')"><div class="profile-overlay"><div class="profile-head">'+avatar(p.avatar_url,p.display_name||p.username,"avatar xlarge")+'<div><div class="eyebrow">CROWSPACE CREATOR PROFILE · 2.3</div><h1>'+esc(p.display_name||p.username||"Crow")+'</h1><div class="muted">@'+esc(p.username||"")+'</div></div></div></div></section><section class="grid2 section"><div class="card"><div class="eyebrow">ABOUT</div><p>'+esc(p.bio||"")+'</p><div class="profile-meta"><span>📍 '+esc(p.location||"Not listed")+'</span>'+(p.website_url?'<a href="'+esc(p.website_url)+'" target="_blank" rel="noopener">🌐 Website</a>':"")+'</div>'+(s?'<div id="membership"></div>':"")+'<div class="actions">'+(other?'<button class="btn red" id="follow">FOLLOW</button><button class="btn" id="friend">'+label+'</button><a class="btn" href="messages.html">MESSAGE</a>':"")+'</div></div><div class="card"><div class="eyebrow">CREATOR SPACE</div><h2>Build.<br><span>Share.</span><br>Create.</h2><p class="muted">Public posts, projects and community connections live here.</p><a class="btn" href="projects.html">VIEW PROJECTS</a></div></section><section class="section"><div class="eyebrow">PUBLIC POSTS</div><div id="profile-feed"></div></section>';if(s)await renderMembership("#membership",s.user);if(other){$("#follow").onclick=async()=>{const r=await db.from("crowspace_follows").upsert({follower_id:s.user.id,following_id:p.user_id});if(r.error)alert(r.error.message);else $("#follow").textContent="FOLLOWING"};$("#friend").onclick=async()=>{const r=await db.rpc("crowspace_send_friend_request",{target_user_id:p.user_id});if(r.error)alert(r.error.message);else $("#friend").textContent=r.data?.status==="accepted"?"FRIENDS":"REQUEST SENT"}}if(member)await renderFeed($("#profile-feed"),s?.user,30,member.id)});</script></body></html>
