<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace Profile</title><link rel="stylesheet" href="css/crowspace.css"></head><body><main class="wrap hero"><div id="profile"></div></main><script>document.addEventListener('DOMContentLoaded',async()=>{const u=new URLSearchParams(location.search).get('u');if(!u){location.href='discover.html';return}const p=(await db.from('crowspace_profiles').select('*').eq('username',u).maybeSingle()).data;if(!p){document.querySelector('#profile').innerHTML='<div class="empty">CrowSpace not found.</div>';return}const s=await getSession();document.querySelector('#profile').innerHTML='<div class="card"><div class="profile-head"><img class="avatar" src="'+esc(p.avatar_url||'')+'"><div><div class="eyebrow">CROWSPACE PROFILE</div><h1>'+esc(p.display_name||p.username)+'</h1><div class="muted">@'+esc(p.username)+'</div></div></div><p>'+esc(p.bio||'')+'</p><div class="actions">'+(s&&s.user.id!==p.user_id?'<button class="btn red" id="follow">FOLLOW</button><button class="btn" id="friend">ADD FRIEND</button>':'')+'</div></div><section class="section"><div class="label">GUESTBOOK</div><div class="card form"><textarea id="guest" placeholder="Leave a message..."></textarea><button class="btn" id="guestbtn">SIGN GUESTBOOK</button></div><div id="guest-list" class="list"></div></section>';if(s&&s.user.id!==p.user_id){document.querySelector('#follow').onclick=async()=>{await db.from('crowspace_follows').upsert({follower_id:s.user.id,following_id:p.user_id});await db.from('crowspace_notifications').insert({user_id:p.user_id,type:'new_follower',actor_id:s.user.id,message:'Someone followed your CrowSpace.'});alert('Following.');document.querySelector('#follow').textContent='FOLLOWING'};document.querySelector('#friend').onclick=async()=>{const r=await db.from('crowspace_friends').upsert({requester_id:s.user.id,recipient_id:p.user_id});if(r.error)alert(r.error.message);else alert('Friend request sent.')}}document.querySelector('#guestbtn').onclick=async()=>{const me=await auth();if(!me)return;const r=await db.from('crowspace_guestbook').insert({profile_id:p.user_id,author_id:me.id,message:document.querySelector('#guest').value.trim()});if(r.error)alert(r.error.message);else location.reload()};const g=(await db.from('crowspace_guestbook').select('message,created_at').eq('profile_id',p.user_id).eq('status','approved').order('created_at',{ascending:false})).data||[];document.querySelector('#guest-list').innerHTML=g.map(x=>'<div class="card"><div class="meta">'+new Date(x.created_at).toLocaleString()+'</div><p>'+esc(x.message)+'</p></div>').join('')||'<div class="empty">No guestbook messages yet.</div>'})</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/app.js"></script></body></html>
