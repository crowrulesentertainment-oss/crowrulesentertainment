<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Friends | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"></head><body data-active="friends"><main class="wrap hero"><div class="eyebrow">CONNECTIONS</div><h1>Friends &<br><span>Followers.</span></h1><div class="grid2"><section class="card"><h2>FRIENDS</h2><div id="friends" class="list"></div></section><aside class="card"><h2>FOLLOWING</h2><div id="following" class="list"></div></aside></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/app.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const u=await auth();if(!u)return;const f=(await db.from("crowspace_friends").select("requester_id,recipient_id").or(`requester_id.eq.${u.id},recipient_id.eq.${u.id}`).eq("status","accepted")).data||[];const ids=[...new Set(f.flatMap(x=>[x.requester_id,x.recipient_id]).filter(x=>x!==u.id))];const p=ids.length?(await db.from("crowspace_profiles").select("username,display_name,avatar_url").in("user_id",ids)).data||[]:[];document.querySelector("#friends").innerHTML=p.map(x=>`<div class="row"><strong>${esc(x.display_name||x.username)}</strong><a class="btn small" href="profile.html?u=${encodeURIComponent(x.username||"")}">VIEW</a></div>`).join("")||'<div class="empty">No friends yet.</div>';const fo=(await db.from("crowspace_follows").select("following_id").eq("follower_id",u.id)).data||[],ids2=fo.map(x=>x.following_id),p2=ids2.length?(await db.from("crowspace_profiles").select("username,display_name").in("user_id",ids2)).data||[]:[];document.querySelector("#following").innerHTML=p2.map(x=>`<div class="row">${esc(x.display_name||x.username)}</div>`).join("")||'<div class="empty">Not following anyone yet.</div>'})</script></body></html>
