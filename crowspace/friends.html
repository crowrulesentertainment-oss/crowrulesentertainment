<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Friends | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"></head>
<body data-active="friends"><main class="wrap hero"><div class="eyebrow">CONNECTIONS</div><h1>Friends &<br><span>Followers.</span></h1>
<section class="card"><h2>FRIEND REQUESTS</h2><div id="requests" class="list"></div></section>
<div class="grid2"><section class="card"><h2>FRIENDS</h2><div id="friends" class="list"></div></section><aside class="card"><h2>FOLLOWING</h2><div id="following" class="list"></div></aside></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/app.js"></script>
<script>
document.addEventListener("DOMContentLoaded",async()=>{
 const u=await auth();if(!u)return;
 const all=(await db.from("crowspace_friends").select("requester_id,recipient_id,status,created_at").or(`requester_id.eq.${u.id},recipient_id.eq.${u.id}`).order("created_at",{ascending:false})).data||[];
 const incoming=all.filter(x=>x.recipient_id===u.id&&x.status==="pending"),outgoing=all.filter(x=>x.requester_id===u.id&&x.status==="pending");
 const ids=[...new Set(all.flatMap(x=>[x.requester_id,x.recipient_id]).filter(x=>x!==u.id))];
 const profiles=ids.length?(await db.from("crowspace_profiles").select("user_id,username,display_name,avatar_url").in("user_id",ids)).data||[]:[];
 const map=Object.fromEntries(profiles.map(x=>[x.user_id,x]));
 const reqBox=document.querySelector("#requests");
 reqBox.innerHTML=[...incoming.map(x=>`<div class="row"><strong>${esc(map[x.requester_id]?.display_name||map[x.requester_id]?.username||"Crow")}</strong><span class="meta">Wants to be your friend</span><button class="btn small red" data-accept="${x.requester_id}">ACCEPT</button><button class="btn small" data-decline="${x.requester_id}">DECLINE</button></div>`),...outgoing.map(x=>`<div class="row"><strong>${esc(map[x.recipient_id]?.display_name||map[x.recipient_id]?.username||"Crow")}</strong><span class="meta">Request sent</span></div>`)].join("")||'<div class="empty">No pending friend requests.</div>';
 for(const b of reqBox.querySelectorAll("[data-accept]")) b.onclick=async()=>{const id=b.dataset.accept,r=await db.from("crowspace_friends").update({status:"accepted",updated_at:new Date().toISOString()}).eq("requester_id",id).eq("recipient_id",u.id);if(r.error)alert(r.error.message);else location.reload()};
 for(const b of reqBox.querySelectorAll("[data-decline]")) b.onclick=async()=>{const id=b.dataset.decline,r=await db.from("crowspace_friends").update({status:"declined",updated_at:new Date().toISOString()}).eq("requester_id",id).eq("recipient_id",u.id);if(r.error)alert(r.error.message);else location.reload()};
 const accepted=all.filter(x=>x.status==="accepted"),friendIds=[...new Set(accepted.flatMap(x=>[x.requester_id,x.recipient_id]).filter(x=>x!==u.id))];
 const fp=friendIds.map(id=>map[id]).filter(Boolean);
 document.querySelector("#friends").innerHTML=fp.map(x=>`<div class="row"><strong>${esc(x.display_name||x.username)}</strong><a class="btn small" href="profile.html?u=${encodeURIComponent(x.username||"")}">VIEW</a></div>`).join("")||'<div class="empty">No friends yet.</div>';
 const fo=(await db.from("crowspace_follows").select("following_id").eq("follower_id",u.id)).data||[],ids2=fo.map(x=>x.following_id),p2=ids2.length?(await db.from("crowspace_profiles").select("username,display_name").in("user_id",ids2)).data||[]:[];
 document.querySelector("#following").innerHTML=p2.map(x=>`<div class="row">${esc(x.display_name||x.username)}</div>`).join("")||'<div class="empty">Not following anyone yet.</div>';
});
</script></body></html>
