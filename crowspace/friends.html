<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Friends | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"></head><body data-active="friends"><main class="wrap hero"><div class="eyebrow">CONNECTIONS · SOCIAL GRAPH</div><h1>Friends &<br><span>Followers.</span></h1><section class="card"><h2>FRIEND REQUESTS</h2><div id="requests" class="list"></div></section><div class="grid2"><section class="card"><h2>FRIENDS</h2><div id="friends" class="list"></div></section><aside class="card"><h2>FOLLOWING</h2><div id="following" class="list"></div></aside></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/app.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const u=await auth();if(!u)return;const q=await db.from("crowspace_friends").select("requester_id,recipient_id,status,created_at").or("requester_id.eq."+u.id+",recipient_id.eq."+u.id).order("created_at",{ascending:false});if(q.error){document.querySelector("#requests").innerHTML='<div class="empty">'+esc(q.error.message)+'</div>';return}const all=q.data||[],ids=[...new Set(all.flatMap(x=>[x.requester_id,x.recipient_id]).filter(x=>x!==u.id))],pr=ids.length?await db.from("crowspace_profiles").select("user_id,username,display_name,avatar_url").in("user_id",ids):{data:[]},map=Object.fromEntries((pr.data||[]).map(x=>[x.user_id,x])),incoming=all.filter(x=>x.recipient_id===u.id&&x.status==="pending"),outgoing=all.filter(x=>x.requester_id===u.id&&x.status==="pending"),box=document.querySelector("#requests");box.innerHTML=[...incoming.map(x=>'<div class="row"><div><strong>'+esc(map[x.requester_id]?.display_name||"Crow")+'</strong><div class="meta">Incoming request</div></div><div class="actions"><button class="btn small red" data-accept="'+x.requester_id+'">ACCEPT</button><button class="btn small" data-decline="'+x.requester_id+'">DECLINE</button></div></div>'),...outgoing.map(x=>'<div class="row"><div><strong>'+esc(map[x.recipient_id]?.display_name||"Crow")+'</strong><div class="meta">Request sent</div></div><a class="btn small" href="profile.html?u='+encodeURIComponent(map[x.recipient_id]?.username||"")+'">VIEW</a></div>')].join("")||'<div class="empty">No pending friend requests.</div>';box.querySelectorAll("[data-accept]").forEach(b=>b.onclick=async()=>{const r=await db.rpc("crowspace_respond_friend_request",{requester:b.dataset.accept,decision:"accepted"});if(r.error)alert(r.error.message);else location.reload()});box.querySelectorAll("[data-decline]").forEach(b=>b.onclick=async()=>{const r=await db.rpc("crowspace_respond_friend_request",{requester:b.dataset.decline,decision:"declined"});if(r.error)alert(r.error.message);else location.reload()});const accepted=all.filter(x=>x.status==="accepted"),friendIds=[...new Set(accepted.flatMap(x=>[x.requester_id,x.recipient_id]).filter(x=>x!==u.id))];document.querySelector("#friends").innerHTML=friendIds.map(id=>map[id]).filter(Boolean).map(x=>'<div class="row"><strong>'+esc(x.display_name||x.username)+'</strong><a class="btn small" href="profile.html?u='+encodeURIComponent(x.username||"")+'">VIEW</a></div>').join("")||'<div class="empty">No friends yet.</div>';const f=await db.from("crowspace_follows").select("following_id").eq("follower_id",u.id),fids=(f.data||[]).map(x=>x.following_id),fp=fids.length?(await db.from("crowspace_profiles").select("username,display_name").in("user_id",fids)).data||[]:[];document.querySelector("#following").innerHTML=fp.map(x=>'<div class="row"><strong>'+esc(x.display_name||x.username)+'</strong><a class="btn small" href="profile.html?u='+encodeURIComponent(x.username||"")+'">VIEW</a></div>').join("")||'<div class="empty">Not following anyone yet.</div>'});</script></body></html>
