<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Your saved CrowSpace posts."><title>Saved Posts | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"></head><body data-active="feed"><main class="wrap hero"><div class="eyebrow">CROWSPACE · YOUR LIBRARY</div><h1>Saved<br><span>Posts.</span></h1><p class="hero-copy">The posts you chose to keep close.</p><div id="saved-list" class="section"><div class="empty">Loading saved posts…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/app.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const u=await auth();if(!u)return;const r=await db.from("crowspace_bookmarks").select("post_id,created_at").eq("user_id",u.id).order("created_at",{ascending:false});if(r.error){$("#saved-list").innerHTML='<div class="empty">'+esc(r.error.message)+'</div>';return}await renderPostsByIds($("#saved-list"),u,(r.data||[]).map(x=>x.post_id))});</script></body></html>
