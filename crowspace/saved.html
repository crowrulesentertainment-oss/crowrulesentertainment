<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saved Posts | CrowSpace 2.3</title><link rel="stylesheet" href="css/crowspace.css"></head><body data-active="feed"><main class="wrap hero"><div class="eyebrow">CROWSPACE 2.3 · YOUR LIBRARY</div><h1>Saved<br><span>Posts.</span></h1><p class="hero-copy">The posts you chose to keep close.</p><div id="saved-list" class="section"><div class="empty">Loading saved posts…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/app.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const u=await auth();if(!u)return;const r=await db.from("crowspace_bookmarks").select("post_id,created_at").eq("user_id",u.id).order("created_at",{ascending:false});if(r.error){$("#saved-list").innerHTML='<div class="empty">'+esc(r.error.message)+'</div>';return}const ids=(r.data||[]).map(x=>x.post_id);if(!ids.length){$("#saved-list").innerHTML='<div class="empty">No saved posts yet. Save something from CrowFeed.</div>';return}const p=await db.from("crowspace_posts").select("id,author_id,body,media_url,like_count,comment_count,created_at").in("id",ids);if(p.error){$("#saved-list").innerHTML='<div class="empty">'+esc(p.error.message)+'</div>';return}await renderFeed($("#saved-list"),u,ids.length);});</script></body></html>
