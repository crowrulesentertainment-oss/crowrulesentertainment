<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Achievements | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"></head><body data-active="space"><main class="wrap hero"><div class="eyebrow">CROWSPACE ACHIEVEMENTS</div><h1>Build Your<br><span>Legacy.</span></h1><div id="list" class="grid"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/app.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const u=await getSession();const a=(await db.from("crowspace_achievements").select("id,code,name,description,icon").order("created_at")).data||[];let earned=new Set();if(u){const e=await db.from("crowspace_user_achievements").select("achievement_id").eq("user_id",u.user.id);earned=new Set((e.data||[]).map(x=>x.achievement_id))}$("#list").innerHTML=a.map(x=>'<article class="card"><div class="feature-icon">'+esc(x.icon||"CR")+'</div><h3>'+esc(x.name)+'</h3><p class="muted">'+esc(x.description)+'</p><div class="meta">'+(earned.has(x.id)?"EARNED":"KEEP BUILDING")+'</div></article>').join("")||'<div class="empty">Achievements are coming online.</div>'});</script></body></html>
