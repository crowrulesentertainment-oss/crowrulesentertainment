<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My CrowSpace 2.2 | CrowRules Entertainment</title><link rel="stylesheet" href="css/crowspace.css"></head><body data-active="space"><main class="wrap hero"><div id="space"></div><section class="section"><div class="eyebrow">CROWSPACE 2.2 · COMMAND CENTER</div><h2>Your universe at a <span>glance.</span></h2><div id="stats" class="grid"></div></section><section class="section"><div class="grid2"><div><div class="eyebrow">MY ACTIVITY</div><div id="feed-list"></div></div><aside><div class="card"><div class="eyebrow">QUICK ACTIONS</div><div class="actions"><a class="btn red" href="feed.html">POST UPDATE</a><a class="btn" href="friends.html">FRIENDS</a><a class="btn" href="groups.html">GROUPS</a><a class="btn" href="projects.html">PROJECTS</a><a class="btn" href="settings.html">CUSTOMIZE</a></div></div><div class="card section"><div class="eyebrow">ONE ACCOUNT · ONE UNIVERSE</div><p class="muted">Your CrowSpace identity is connected to Universal CrowRules Membership.</p><a class="btn" href="../membership.html">MANAGE MEMBERSHIP</a></div></aside></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/app.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const u=await auth();if(!u)return;const p=await profile(u),m=await membership(u),s=await db.rpc("crowspace_dashboard_stats"),st=s.data||{};$("#space").innerHTML='<div class="card profile-card"><div class="profile-head">'+avatar(p?.avatar_url,p?.display_name,"avatar xlarge")+'<div><div class="eyebrow">MY CROWSPACE 2.2</div><h1>'+esc(p?.display_name||"Crow")+'</h1><div class="muted">@'+esc(p?.username||"set-username")+'</div></div></div><p>'+esc(p?.bio||"Welcome to my CrowSpace.")+'</p><div class="profile-meta"><span>📍 '+esc(p?.location||"Not listed")+'</span></div><div class="membership-badge"><div class="membership-mark">CR</div><div class="membership-info"><strong>UNIVERSAL CROWRULES MEMBER</strong><span>'+esc(m?.membership_plans?.name||"CROW")+'</span><small>Status: '+esc(m?.status||"active")+'</small></div><a class="btn small" href="../membership.html">MANAGE</a></div><div class="actions"><a class="btn red" href="settings.html">CUSTOMIZE MY SPACE</a><a class="btn" href="profile.html?u='+encodeURIComponent(p?.username||"")+'">PUBLIC PROFILE</a><a class="btn" href="achievements.html">ACHIEVEMENTS</a></div></div>';const cards=[["FRIENDS",st.friends||0,"friends.html"],["REQUESTS",st.pending||0,"friends.html"],["FOLLOWING",st.following||0,"friends.html"],["FOLLOWERS",st.followers||0,"discover.html"],["POSTS",st.posts||0,"feed.html"],["GROUPS",st.groups||0,"groups.html"],["PROJECTS",st.projects||0,"projects.html"],["UNREAD",st.unread||0,"notifications.html"]];$("#stats").innerHTML=cards.map(x=>'<a class="card feature-card stat-card" href="'+x[2]+'"><div class="feature-icon">'+x[0]+'</div><h2>'+x[1]+'</h2><span class="text-link">OPEN →</span></a>').join("");await renderFeed($("#feed-list"),u,20,null)})</script></body></html>
