<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"></head><body data-active="space"><main class="wrap hero"><div id="space"></div><section class="section"><div class="label">MY FEED</div><div id="feed-list"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/app.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const u=await auth();if(!u)return;const p=await profile(u),m=await membership(u);document.querySelector("#space").innerHTML='<div class="card profile-card"><div class="profile-head">'+avatar(p?.avatar_url,p?.display_name,"avatar xlarge")+'<div><div class="eyebrow">MY CROWSPACE</div><h1>'+esc(p?.display_name||"Crow")+'</h1><div class="muted">@'+esc(p?.username||"set-username")+'</div></div></div><p>'+esc(p?.bio||"Welcome to my CrowSpace.")+'</p><div class="profile-meta"><span>📍 '+esc(p?.location||"Not listed")+'</span></div><div class="membership-badge"><div class="membership-mark">CR</div><div class="membership-info"><strong>UNIVERSAL CROWRULES MEMBER</strong><span>'+esc(m?.membership_plans?.name||"CROW")+'</span><small>Status: '+esc(m?.status||"active")+'</small></div><a class="btn small" href="../membership.html">MANAGE</a></div><div class="actions"><a class="btn red" href="settings.html">CUSTOMIZE MY SPACE</a><a class="btn" href="profile.html?u='+encodeURIComponent(p?.username||"")+'">PUBLIC PROFILE</a></div></div>');await feed()});</script></body></html>
