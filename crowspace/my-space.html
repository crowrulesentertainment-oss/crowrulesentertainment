<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"></head><body data-active="space"><main class="wrap hero"><div id="space"></div></main><section class="wrap section"><div class="label">MY FEED</div><div id="feed-list"></div></section><script>document.addEventListener('DOMContentLoaded',async()=>{const u=await auth();if(!u)return;const p=await profile(u);document.querySelector('#space').innerHTML='<div class="card"><div class="profile-head"><img class="avatar" src="'+esc(p.avatar_url||'')+'"><div><div class="eyebrow">MY CROWSPACE</div><h1>'+esc(p.display_name||'Crow')+'</h1><div class="muted">@'+esc(p.username||'set-username')+'</div></div></div><p>'+esc(p.bio||'Welcome to my CrowSpace.')+'</p><div class="actions"><a class="btn red" href="settings.html">CUSTOMIZE MY SPACE</a><a class="btn" href="profile.html?u='+encodeURIComponent(p.username||'')+'">PUBLIC PROFILE</a></div></div>';feed()})</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/app.js"></script></body></html>
