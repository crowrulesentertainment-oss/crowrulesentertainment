<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Groups | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"></head><body data-active="groups"><main class="wrap hero"><div class="eyebrow">CROWSPACE GROUPS</div><h1>Find Your<br><span>Community.</span></h1><div class="grid2"><section><div class="card form"><input id="name" maxlength="120" placeholder="Group name"><input id="slug" maxlength="120" placeholder="group-slug"><textarea id="description" maxlength="2000" placeholder="What is this group about?"></textarea><select id="visibility"><option value="public">Public</option><option value="members">Members</option></select><button class="btn red" id="create">CREATE GROUP</button><div id="status" class="muted"></div></div><div id="list" class="section"></div></section><aside class="card"><h2>Build a Crew.</h2><p class="muted">Create communities for sports, shows, Tacoma, creators, projects, fandoms and anything else that belongs in the CrowRules universe.</p></aside></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/app.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const u=await auth();if(!u)return;async function load(){const q=(await db.from("crowspace_groups").select("name,slug,description,visibility,status,created_at").in("status",["future","planned","active"]).order("created_at",{ascending:false}).limit(50)).data||[];document.querySelector("#list").innerHTML=q.map(x=>`<article class="card"><div class="eyebrow">GROUP</div><h3>${esc(x.name)}</h3><div class="meta">@${esc(x.slug)} · ${esc(x.visibility)} · ${esc(x.status)}</div><p class="muted">${esc(x.description||"")}</p></article>`).join("")||'<div class="empty">No groups yet.</div>'}await load();document.querySelector("#create").onclick=async()=>{const name=document.querySelector("#name").value.trim(),slug=document.querySelector("#slug").value.trim().toLowerCase().replace(/[^a-z0-9-]/g,"-"),description=document.querySelector("#description").value.trim(),visibility=document.querySelector("#visibility").value;if(!name||!slug)return;const r=await db.from("crowspace_groups").insert({name,slug,description,visibility,status:"active",owner_id:u.id});document.querySelector("#status").textContent=r.error?r.error.message:"Group created.";if(!r.error){document.querySelector("#name").value="";document.querySelector("#slug").value="";document.querySelector("#description").value="";await load()}}})</script></body></html>
