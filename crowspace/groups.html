<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="CrowSpace communities and group feeds."><title>Groups | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"></head><body data-active="groups"><main class="wrap hero"><div class="eyebrow">CROWSPACE · GROUPS</div><h1>Find Your<br><span>Community.</span></h1><div class="grid2"><section><div class="card form"><div class="form-label">CREATE A GROUP</div><input id="name" maxlength="120" placeholder="Group name"><input id="slug" maxlength="120" placeholder="group-slug"><textarea id="description" maxlength="2000" placeholder="What is this group about?"></textarea><select id="visibility"><option value="public">Public</option><option value="members">Members</option></select><button class="btn red" id="create" type="button">CREATE GROUP</button><div id="status" class="muted"></div></div><div id="list" class="section"></div></section><aside><div class="card"><div class="eyebrow">COMMUNITIES</div><h2>Build a <span>Crew.</span></h2><p class="muted">Create spaces for sports, shows, Tacoma, creators, projects, fandoms and interests across CrowRules.</p></div><div id="mine" class="card section"></div></aside></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/app.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const u=await auth();if(!u)return;async function load(){const q=await db.from("crowspace_groups").select("id,name,slug,description,visibility,status,owner_id,created_at").in("status",["future","planned","active"]).order("created_at",{ascending:false}).limit(50);if(q.error){$("#list").innerHTML='<div class="empty">'+esc(q.error.message)+'</div>';return}const groups=q.data||[],ids=groups.map(x=>x.id);const mine=ids.length?(await db.from("crowspace_group_members").select("group_id").eq("user_id",u.id).in("group_id",ids)).data||[]:[];const joined=new Set(mine.map(x=>x.group_id));$("#list").innerHTML=groups.map(x=>'<article class="card"><div class="eyebrow">GROUP · '+esc(x.status)+'</div><h3>'+esc(x.name)+'</h3><div class="meta">@'+esc(x.slug)+' · '+esc(x.visibility)+'</div><p class="muted">'+esc(x.description||"")+'</p><div class="actions"><button class="btn small '+(joined.has(x.id)?"":"red")+'" data-group="'+esc(x.id)+'" type="button">'+(joined.has(x.id)?"LEAVE GROUP":"JOIN GROUP")+'</button><a class="btn small" href="group.html?id='+encodeURIComponent(x.id)+'">OPEN FEED</a></div></article>').join("")||'<div class="empty">No groups yet.</div>';$("#mine").innerHTML='<div class="eyebrow">YOUR GROUPS</div><h3>'+joined.size+'</h3><p class="muted">communities joined</p>';document.querySelectorAll("[data-group]").forEach(b=>b.onclick=async()=>{const r=await db.rpc("crowspace_toggle_group_membership",{target_group:b.dataset.group});if(r.error)alert(r.error.message);else load()})}await load();$("#create").onclick=async()=>{const name=$("#name").value.trim(),slug=$("#slug").value.trim().toLowerCase().replace(/[^a-z0-9-]/g,"-").replace(/-+/g,"-").replace(/^-|-$/g,""),description=$("#description").value.trim(),visibility=$("#visibility").value;if(!name||!slug){$("#status").textContent="Enter a group name and slug.";return}const r=await db.from("crowspace_groups").insert({name,slug,description,visibility,status:"active",owner_id:u.id});$("#status").textContent=r.error?r.error.message:"Group created.";if(!r.error){$("#name").value="";$("#slug").value="";$("#description").value="";await load()}}});</script></body></html>
