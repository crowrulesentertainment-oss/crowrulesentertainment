<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace Settings</title><link rel="stylesheet" href="css/crowspace.css"></head><body data-active="settings"><main class="wrap hero"><div class="eyebrow">MY SPACE SETTINGS</div><h1>Customize<br><span>Your Space.</span></h1><div class="card"><form id="form" class="form"><input id="username" placeholder="Username"><input id="display_name" placeholder="Display name"><input id="avatar_url" placeholder="Avatar URL"><input id="banner_url" placeholder="Banner URL"><input id="location" placeholder="Location"><input id="website_url" placeholder="Website"><textarea id="bio" placeholder="About me"></textarea><select id="theme"><option>crow-dark</option><option>neon</option><option>retro</option><option>creator</option><option>midnight</option></select><select id="profile_visibility"><option value="public">Public</option><option value="members">Members</option><option value="friends">Friends</option><option value="private">Private</option></select><button class="btn red">SAVE MY SPACE</button><div id="status" class="muted"></div></form></div></main><script>document.addEventListener('DOMContentLoaded',async()=>{const u=await auth();if(!u)return;const p=await profile(u);['username','display_name','avatar_url','banner_url','location','website_url','bio','theme','profile_visibility'].forEach(k=>document.querySelector('#'+k).value=p?.[k]||'');document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const v={user_id:u.id};['username','display_name','avatar_url','banner_url','location','website_url','bio','theme','profile_visibility'].forEach(k=>v[k]=document.querySelector('#'+k).value.trim());const r=await db.from('crowspace_profiles').upsert(v);document.querySelector('#status').textContent=r.error?r.error.message:'Saved.'}})</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/app.js"></script></body></html>
