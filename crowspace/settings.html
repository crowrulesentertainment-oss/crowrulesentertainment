<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowSpace Settings</title><link rel="stylesheet" href="css/crowspace.css"></head><body data-active="settings"><main class="wrap hero"><div class="eyebrow">MY SPACE SETTINGS</div><h1>Customize<br><span>Your Space.</span></h1><div class="card"><div id="member-status"></div><form id="form" class="form"><input id="username" placeholder="Username"><input id="display_name" placeholder="Display name"><input id="avatar_url" placeholder="Avatar URL"><input id="banner_url" placeholder="Banner URL"><input id="location" placeholder="Location"><input id="website_url" placeholder="Website"><textarea id="bio" placeholder="About me"></textarea><select id="theme"><option value="crow-dark">Crow Dark</option><option value="neon">Neon</option><option value="retro">Retro</option><option value="creator">Creator</option><option value="midnight">Midnight</option></select><select id="profile_visibility"><option value="public">Public</option><option value="members">Members</option><option value="friends">Friends</option><option value="private">Private</option></select><button class="btn red">SAVE MY SPACE</button><div id="status" class="muted"></div></form></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/app.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const u=await auth();if(!u)return;const p=await profile(u),m=await membership(u);document.querySelector("#member-status").innerHTML=`<div class="membership-badge"><div class="membership-mark">CR</div><div class="membership-info"><strong>UNIVERSAL CROWRULES MEMBER</strong><span>${esc(m?.membership_plans?.name||"CROW")}</span><small>Status: ${esc(m?.status||"active")}</small></div><a class="btn small" href="../membership.html">MANAGE</a></div>`;["username","display_name","avatar_url","banner_url","location","website_url","bio","theme","profile_visibility"].forEach(k=>document.querySelector("#"+k).value=p?.[k]||"");document.querySelector("#form").onsubmit=async e=>{e.preventDefault();const v={user_id:u.id};["username","display_name","avatar_url","banner_url","location","website_url","bio","theme","profile_visibility"].forEach(k=>v[k]=document.querySelector("#"+k).value.trim());const r=await db.from("crowspace_profiles").upsert(v);document.querySelector("#status").textContent=r.error?r.error.message:"Your CrowSpace has been saved."}})</script></body></html>
