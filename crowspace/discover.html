<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discover | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"></head><body data-active="discover"><main class="wrap hero"><div class="eyebrow">DISCOVER · CREATORS · PROJECTS</div><h1>Find Your<br><span>Crow Crew.</span></h1><div class="card form"><input id="q" placeholder="Search people and projects"><div id="results"></div></div><div class="grid2 section"><section class="card"><h2>CREATORS</h2><div id="people" class="list"></div></section><aside class="card"><h2>PROJECTS</h2><div id="projects" class="list"></div></aside></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/app.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const people=(await db.from("crowspace_members").select("user_id,username,display_name,avatar_url").eq("is_public",true).order("created_at",{ascending:false}).limit(60)).data||[];const projects=(await db.from("crowspace_projects").select("id,title,category,status,description").order("created_at",{ascending:false}).limit(40)).data||[];function draw(term=""){term=term.toLowerCase();document.querySelector("#people").innerHTML=people.filter(x=>(x.display_name||"").toLowerCase().includes(term)||(x.username||"").toLowerCase().includes(term)).map(x=>'<div class="row"><div class="row-person">'+avatar(x.avatar_url,x.display_name,"avatar mini")+'<strong>'+esc(x.display_name||x.username||"Crow")+'</strong></div><a class="btn small" href="profile.html?u='+encodeURIComponent(x.username||"")+'">VIEW</a></div>').join("")||'<div class="empty">No creators found.</div>';document.querySelector("#projects").innerHTML=projects.filter(x=>(x.title||"").toLowerCase().includes(term)||(x.category||"").toLowerCase().includes(term)).map(x=>'<article class="project-item"><strong>'+esc(x.title)+'</strong><div class="meta">'+esc(x.category||"Project")+' · '+esc(x.status)+'</div><p class="muted">'+esc(x.description||"")+'</p></article>').join("")||'<div class="empty">No projects found.</div>'}draw();document.querySelector("#q").oninput=e=>draw(e.target.value)});</script></body></html>
