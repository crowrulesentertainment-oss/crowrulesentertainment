<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discover CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"></head><body data-active="discover"><main class="wrap hero"><div class="eyebrow">DISCOVER</div><h1>Find Your<br><span>Crow Crew.</span></h1><div class="grid2"><section class="card"><h2>CREATORS</h2><div id="people" class="list"></div></section><aside class="card"><h2>PROJECTS</h2><div id="projects" class="list"></div></aside></div></main><script>document.addEventListener('DOMContentLoaded',async()=>{const p=(await db.from('crowspace_profiles').select('username,display_name').eq('profile_visibility','public').limit(30)).data||[];document.querySelector('#people').innerHTML=p.map(x=>'<div class="row"><span>'+esc(x.display_name||x.username||'Crow')+'</span><a class="btn" href="profile.html?u='+encodeURIComponent(x.username||'')+'">VIEW</a></div>').join('')||'<div class="empty">No public Spaces yet.</div>';const q=(await db.from('crowspace_projects').select('title,category,status').order('created_at',{ascending:false}).limit(20)).data||[];document.querySelector('#projects').innerHTML=q.map(x=>'<div class="row"><span><strong>'+esc(x.title)+'</strong><br><small>'+esc(x.category||'Project')+' · '+esc(x.status)+'</small></span></div>').join('')||'<div class="empty">No projects yet.</div>'})</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/app.js"></script></body></html>
