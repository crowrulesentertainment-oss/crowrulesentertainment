<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discover | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"></head><body data-active="discover"><main class="wrap hero"><div class="eyebrow">DISCOVER</div><h1>Find Your<br><span>Crow Crew.</span></h1><div class="grid2"><section class="card"><h2>CREATORS</h2><div id="people" class="list"></div></section><aside class="card"><h2>PROJECTS</h2><div id="projects" class="list"></div></aside></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/app.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const p=(await db.from("crowspace_members").select("username,display_name,avatar_url").eq("is_public",true).limit(40)).data||[];document.querySelector("#people").innerHTML=p.map(x=>`<div class="row"><div class="row-person"><img class="avatar mini" src="${esc(x.avatar_url||"")}" alt=""><strong>${esc(x.display_name||x.username||"Crow")}</strong></div><a class="btn small" href="profile.html?u=${encodeURIComponent(x.username||"")}">VIEW</a></div>`).join("")||'<div class="empty">No public Spaces yet.</div>';const q=(await db.from("crowspace_projects").select("title,category,status,description").order("created_at",{ascending:false}).limit(20)).data||[];document.querySelector("#projects").innerHTML=q.map(x=>`<div class="project-item"><strong>${esc(x.title)}</strong><div class="meta">${esc(x.category||"Project")} · ${esc(x.status||"idea")}</div><p class="muted">${esc(x.description||"")}</p></div>`).join("")||'<div class="empty">No projects yet.</div>'})</script></body></html>
