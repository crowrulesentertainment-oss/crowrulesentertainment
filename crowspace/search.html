<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search | CrowSpace</title><link rel="stylesheet" href="css/crowspace.css"></head><body data-active="discover"><main class="wrap hero"><div class="eyebrow">CROWSPACE SEARCH</div><h1>Find<br><span>Your People.</span></h1><div class="card form"><input id="q" autofocus placeholder="Search usernames, creators, projects or groups"><div id="status" class="meta"></div></div><div class="grid2 section"><section class="card"><h2>PEOPLE</h2><div id="people" class="list"></div></section><section class="card"><h2>PROJECTS</h2><div id="projects" class="list"></div></section></div><section class="card"><h2>GROUPS</h2><div id="groups" class="list"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/app.js"></script><script>document.addEventListener("DOMContentLoaded",async()=>{const people=(await db.from("crowspace_members").select("username,display_name,avatar_url").eq("is_public",true).limit(100)).data||[],projects=(await db.from("crowspace_projects").select("title,category,status,description").limit(100)).data||[],groups=(await db.from("crowspace_groups").select("name,slug,description,status").in("status",["future","planned","active"]).limit(100)).data||[];function draw(){const t=$("#q").value.trim().toLowerCase();const p=people.filter(x=>(x.username||"").toLowerCase().includes(t)||(x.display_name||"").toLowerCase().includes(t));const pr=projects.filter(x=>(x.title||"").toLowerCase().includes(t)||(x.category||"").toLowerCase().includes(t));const g=groups.filter(x=>(x.name||"").toLowerCase().includes(t)||(x.slug||"").toLowerCase().includes(t));$("#status").textContent=t?"Showing matches for “"+t+"”":"Showing all available results";$("#people").innerHTML=p.map(x=>'<div class="row"><div class="row-person">'+avatar(x.avatar_url,x.display_name,"avatar mini")+'<strong>'+esc(x.display_name||x.username)+'</strong></div><a class="btn small" href="profile.html?u='+encodeURIComponent(x.username||"")+'">VIEW</a></div>').join("")||'<div class="empty">No people found.</div>';$("#projects").innerHTML=pr.map(x=>'<div class="project-item"><strong>'+esc(x.title)+'</strong><div class="meta">'+esc(x.category||"Project")+' · '+esc(x.status)+'</div><p class="muted">'+esc(x.description||"")+'</p></div>').join("")||'<div class="empty">No projects found.</div>';$("#groups").innerHTML=g.map(x=>'<div class="row"><div><strong>'+esc(x.name)+'</strong><div class="meta">@'+esc(x.slug)+' · '+esc(x.status)+'</div></div></div>').join("")||'<div class="empty">No groups found.</div>'}draw();$("#q").oninput=draw});</script></body></html>
