<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support CrowRules</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://www.paypalobjects.com/donate/sdk/donate-sdk.js"></script><script src="app.js"></script></head><body><script>document.write(nav('support'))</script><main class="wrap page"><div class="eyebrow">07 / SUPPORT</div><section class="hero"><h1>BACK THE <span>BUILD.</span></h1><p class="lead">Choose a CrowRules campaign and continue securely through PayPal. This page does not collect bank-account credentials.</p></section><div class="grid g3" id="campaigns"></div><div class="card" style="margin-top:20px"><h2 id="selected">Select a campaign</h2><div id="paypal"><p>PayPal donation button awaiting configuration.</p></div></div></main><script>let camp=null;async function load(){let a=(await rows('cr_donation_campaigns')).filter(x=>x.active!==false);campaigns.innerHTML=a.length?a.map((x,i)=>`<article class="card"><span class="tag">${x.featured?'FEATURED':'CAMPAIGN'}</span><h2>${esc(x.name)}</h2><p>${esc(x.description||'')}</p><p><b>${x.goal_amount?money(x.goal_amount,x.currency||'USD'):'No goal set'}</b></p><button class="btn" onclick="pick('${esc(x.id)}')">SUPPORT →</button></article>`).join(''):'<div class="card"><h2>No active campaigns.</h2><p>Campaigns will appear here when configured in the Business Hub.</p></div>';if(a.length)pick(a[0].id)}async function pick(id){let a=await rows('cr_donation_campaigns');camp=a.find(x=>x.id===id);if(!camp)return;selected.textContent=camp.name;let s=(await rows('cr_donation_settings'))[0];paypal.innerHTML='';if(!s||s.donations_enabled===false||!s.paypal_hosted_button_id){paypal.innerHTML='<p>PayPal is not currently configured for this campaign.</p>';return}if(window.PayPal?.Donation?.Button){try{PayPal.Donation.Button({env:s.paypal_environment||'production',hosted_button_id:s.paypal_hosted_button_id,item_name:camp.paypal_item_name||camp.name,item_number:camp.paypal_item_number||camp.slug}).render('#paypal')}catch(e){paypal.innerHTML='<p>PayPal could not render. Check the hosted button configuration.</p>'}}}load()</script><script>document.write(foot())</script></body></html>
