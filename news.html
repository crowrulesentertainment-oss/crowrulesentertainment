<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowRules Newsroom</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></head><body><script>document.write(nav('news'))</script><main class="wrap page"><div class="eyebrow">04 / NEWSROOM</div><section class="hero"><h1>LATEST <span>NEWS.</span></h1><p class="lead">Official CrowRules stories and company announcements published from Supabase.</p><input class="search" id="q" placeholder="Search the newsroom..."></section><div class="grid g3" id="grid"><div class="card"><p>Loading newsroom...</p></div></div></main><script>let all=[];async function load(){all=(await rows('cr_news')).filter(x=>x.status==='published').sort((a,b)=>new Date(b.published_at||b.created_at)-new Date(a.published_at||a.created_at));render()}function render(){let q=qEl.value.toLowerCase();let a=all.filter(x=>(x.title+' '+(x.excerpt||'')+' '+(x.content||'')).toLowerCase().includes(q));grid.innerHTML=a.length?a.map(x=>`<article class="card"><div class="meta">${esc(x.category||'NEWS')} · ${esc(x.division||'')} · ${dt(x.published_at||x.created_at)}</div><h2>${esc(x.title)}</h2><p>${esc(x.excerpt||x.content||'')}</p>${x.source_url?`<a class="btn" target="_blank" rel="noopener" href="${esc(x.source_url)}">SOURCE →</a>`:''}</article>`).join(''):'<div class="card"><h2>No stories found.</h2><p>Try another search.</p></div>'}const qEl=document.getElementById('q');qEl.oninput=render;load();if(sb)sb.channel('news-page').on('postgres_changes',{event:'*',schema:'public',table:'cr_news'},load).subscribe();</script><script>document.write(foot())</script></body></html>
