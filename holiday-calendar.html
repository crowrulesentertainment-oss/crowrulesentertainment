<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowRules Universe Holiday Calendar</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
body{margin:0;background:#05050b;color:#fff;font:14px Arial,sans-serif}main{max-width:1150px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.muted{color:#8f98b2}.grid{display:grid;grid-template-columns:380px 1fr;gap:18px}.card{background:#0d101a;border:1px solid #282f45;border-radius:18px;padding:20px;margin-top:20px}label{display:block;margin:10px 0 5px;color:#aeb8d2;font-size:12px}input,select{width:100%;box-sizing:border-box;padding:10px;border-radius:9px;border:1px solid #343c56;background:#080a12;color:#fff}button{padding:10px 14px;border:0;border-radius:9px;background:#20e6ff;font-weight:700;cursor:pointer}.secondary{background:#252b3d;color:#fff}.danger{background:#7d2636;color:#fff}.row{display:flex;gap:8px;flex-wrap:wrap}.theme{padding:15px;border:1px solid #293047;border-radius:13px;margin:9px 0}.theme.current{border-color:#20e6ff}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}.status{min-height:20px;margin-top:10px}@media(max-width:800px){.grid{grid-template-columns:1fr}main{padding:15px}}
</style></head><body><main><div class="top"><div><div class="muted">CROWRULES ENTERTAINMENT</div><h1>Universe Holiday Calendar</h1><p class="muted">One seasonal schedule powering CrowSpace, Dreamscapes, Podcasting and Memorials.</p></div><a href="https://crowrulesentertainment-oss.github.io/crowrulesentertainment/" style="color:#8fefff">CrowRules Hub</a></div><div id="gate" class="card">Checking administrator access…</div><section id="app" class="grid" style="display:none"><div class="card"><h2 id="ft">Create Theme</h2><form id="form"><input type="hidden" id="id"><label>Name</label><input id="name" required><label>Slug</label><input id="slug" required><label>Starts</label><input id="starts" type="date" required><label>Ends</label><input id="ends" type="date" required><label>Particle Set</label><select id="particle"><option>seasonal</option><option>halloween</option><option>thanksgiving</option><option>christmas</option><option>new-years</option><option>valentines</option><option>spring</option><option>summer</option><option>fall</option></select><label>Accent</label><input id="accent" value="#20e6ff"><label>Secondary</label><input id="secondary" value="#8b5cf6"><label>Background URL</label><input id="background"><label>CSS Class</label><input id="cssClass"><label>Priority (lower = wins)</label><input id="priority" type="number" value="100"><label><input id="active" type="checkbox" checked style="width:auto"> Active</label><div class="row"><button>Save</button><button type="button" class="secondary" id="newBtn">New</button></div><div id="status" class="status muted"></div></form></div><div class="card"><div class="top"><h2>Schedule</h2><button class="secondary" id="refresh">Refresh</button></div><div id="list"></div></div></section></main><script>
const db=supabase.createClient("https://cevylpnoexugwgygvtgu.supabase.co","sb_publishable_AdfM5y6RqvF3tbvEVzDZSg_JuGTQLD-"),$=x=>document.getElementById(x);let data=[];
async function init(){const s=await db.auth.getSession();if(!s.data.session){gate.textContent="Sign in to CrowRules first.";return}const a=await db.rpc("cr_platform_is_admin");if(a.error||a.data!==true){gate.textContent="Administrator access is required.";return}gate.style.display="none";app.style.display="grid";load()}
async function load(){const r=await db.from("crowrules_holiday_calendar").select("*").order("priority").order("starts_on");if(r.error){status.textContent=r.error.message;return}data=r.data||[];list.innerHTML=data.map(t=>'<div class="theme"><b><span class="dot" style="background:'+esc(t.accent_color||"#20e6ff")+'"></span>'+esc(t.name)+'</b><div class="muted">'+esc(t.starts_on)+' → '+esc(t.ends_on)+' · '+esc(t.particle_set)+' · '+(t.is_active?"Active":"Inactive")+'</div><div class="row" style="margin-top:8px"><button onclick="edit(\''+t.id+'\')">Edit</button><button class="danger" onclick="delTheme(\''+t.id+'\')">Delete</button></div></div>').join("")||'<p class="muted">No themes.</p>'}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
window.edit=id=>{const t=data.find(x=>x.id===id);if(!t)return;ft.textContent="Edit Theme";$("id").value=t.id;name.value=t.name;slug.value=t.slug;starts.value=t.starts_on;ends.value=t.ends_on;particle.value=t.particle_set||"seasonal";accent.value=t.accent_color||"#20e6ff";secondary.value=t.secondary_color||"#8b5cf6";background.value=t.background_url||"";cssClass.value=t.css_class||"";priority.value=t.priority??100;active.checked=!!t.is_active}
window.delTheme=async id=>{if(!confirm("Delete this theme?"))return;const r=await db.rpc("crowrules_holiday_admin_delete",{p_id:id});status.textContent=r.error?r.error.message:"Theme deleted.";if(!r.error)load()}
form.onsubmit=async e=>{e.preventDefault();if(starts.value>ends.value){status.textContent="End date must be on or after start date.";return}const r=await db.rpc("crowrules_holiday_admin_save",{p_id:$("id").value||null,p_name:name.value.trim(),p_slug:slug.value.trim().toLowerCase(),p_starts_on:starts.value,p_ends_on:ends.value,p_background_url:background.value.trim()||null,p_accent_color:accent.value.trim()||null,p_secondary_color:secondary.value.trim()||null,p_css_class:cssClass.value.trim()||null,p_particle_set:particle.value,p_is_active:active.checked,p_priority:Number(priority.value)||100});status.textContent=r.error?r.error.message:"Theme saved.";if(!r.error){newBtn.click();load()}}
function reset(){form.reset();$("id").value="";ft.textContent="Create Theme";accent.value="#20e6ff";secondary.value="#8b5cf6";priority.value=100;active.checked=true}newBtn.onclick=reset;refresh.onclick=load;init();
</script></body></html>
